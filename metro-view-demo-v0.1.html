<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Landbox · Metro view demo v0.1</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#231811;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#view.pix{image-rendering:pixelated;image-rendering:crisp-edges}
</style>
<!-- ===================== METRO UI: PANEL / HUD MARKUP + CSS (one block; restyle here) =====================
     Layout per Mocky's spec /workspace/projects/metro-view-layout-spec-v0.1-2026-11-13.md
     Chrome colours: Leather #231811 @70%, Gilt #C9A55A selected, Parchment #F2E6C9 text. Mock bar (z 18–20) sits above all of this (z ≤ 12). -->
<style>
:root{--leather:rgba(35,24,17,.7);--leather-solid:#231811;--gilt:#C9A55A;--parch:#F2E6C9;--muted:#bfae8a;--edge:rgba(201,165,90,.35)}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;font:13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--parch);user-select:none;-webkit-user-select:none}
#ui button{font:inherit;color:inherit;cursor:pointer}
body.noui #ui{display:none}
#topbar{position:absolute;left:0;right:0;top:0;height:44px;padding:env(safe-area-inset-top) 6px 0;display:flex;align-items:center;gap:6px;background:var(--leather);pointer-events:auto;box-sizing:content-box}
#topbar button{min-width:44px;height:44px;background:none;border:0;padding:0 8px;font-size:15px}
#gear{font-size:20px!important}
#place{flex:1;text-align:center;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud{position:absolute;left:8px;top:calc(48px + env(safe-area-inset-top));font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--parch);background:rgba(35,24,17,.5);padding:2px 6px;border-radius:4px;pointer-events:none;white-space:nowrap}
#quick{position:absolute;left:0;right:0;bottom:0;height:56px;padding:6px 6px calc(6px + env(safe-area-inset-bottom)) 92px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--leather);pointer-events:auto;box-sizing:border-box}
#quick::-webkit-scrollbar{display:none}
.qchip{flex:0 0 auto;min-width:60px;height:44px;border-radius:10px;border:1px solid var(--edge);background:rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;line-height:1.05}
.qchip span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qchip b{font-size:12px;font-weight:600;color:var(--gilt);white-space:nowrap}
#stick{position:absolute;left:62px;bottom:72px;width:120px;height:120px;border-radius:50%;background:rgba(242,230,201,.12);border:2px solid rgba(242,230,201,.35);pointer-events:auto;touch-action:none;display:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(201,165,90,.75);box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none}
body[data-control="stick"] #stick{display:block}
#rbtns{position:absolute;right:10px;bottom:72px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
#rbtns button{width:60px;height:60px;border-radius:50%;border:2px solid var(--edge);background:var(--leather);font-weight:700;touch-action:none}
#rbtns button.on{background:var(--gilt);color:var(--leather-solid)}
#sheet{position:absolute;left:0;right:0;bottom:0;height:60%;background:rgba(35,24,17,.92);border-top:1px solid var(--edge);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .2s ease;pointer-events:auto;display:flex;flex-direction:column;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
#sheet.open{transform:none}
#sheet-handle{height:18px;display:flex;align-items:center;justify-content:center;touch-action:none}
#sheet-handle::before{content:"";width:44px;height:4px;border-radius:2px;background:var(--edge)}
#sheet-top{display:flex;align-items:center;gap:6px;padding:0 8px 6px;border-bottom:1px solid var(--edge)}
#sheet-top h2{flex:1;margin:0;font-size:14px;text-align:center;color:var(--gilt)}
#sheet-top button{height:36px;min-width:44px;border:1px solid var(--edge);background:rgba(0,0,0,.25);border-radius:8px;padding:0 10px;font-size:12px}
#sheet-x{font-size:16px!important}
#sheet-body{flex:1;overflow-y:auto;padding:4px 8px 16px;-webkit-overflow-scrolling:touch}
.grp{border-bottom:1px solid rgba(201,165,90,.15)}
.grp-h{width:100%;height:40px;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:0 4px;font-weight:700!important;color:var(--gilt)!important;letter-spacing:.04em}
.grp-h span{transition:transform .15s;transform:rotate(-90deg)}
.grp.open .grp-h span{transform:none}
.grp-b{display:none;padding:0 2px 8px}
.grp.open .grp-b{display:block}
.row{display:flex;align-items:center;gap:8px;min-height:44px}
.row.dis{opacity:.35;pointer-events:none}
.row label{flex:0 0 74px;color:var(--muted);font-size:12px}
.ctl{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.seg{flex-wrap:wrap;gap:4px}
.chip{min-height:36px;padding:0 9px;border-radius:8px;border:1px solid var(--edge);background:rgba(0,0,0,.25);font-size:12px}
.chip.on{background:var(--gilt);color:var(--leather-solid)!important;border-color:var(--gilt);font-weight:700}
.chip.pal{display:flex;align-items:center;gap:2px}
.chip.pal i{width:9px;height:16px;border-radius:2px;display:inline-block}
.chip.pal span{margin-left:4px}
.sw{min-width:56px;height:32px;border-radius:16px;border:1px solid var(--edge);background:rgba(0,0,0,.3);font-size:12px}
.sw.on{background:var(--gilt);color:var(--leather-solid)!important;font-weight:700}
.ctl input[type=range]{flex:1;accent-color:var(--gilt);min-height:36px}
.ctl output{flex:0 0 74px;font-size:12px;text-align:right;color:var(--parch)}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:rgba(35,24,17,.9);border:1px solid var(--edge);padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
/* phone landscape / desktop: quick row → slim right column, panel → right sheet 320 px */
@media (orientation:landscape) and (min-width:600px){
  #quick{left:auto;top:52px;right:0;bottom:auto;width:84px;height:auto;flex-direction:column;padding:6px;border-radius:10px 0 0 10px}
  .qchip{min-width:0;width:100%}
  #rbtns{right:96px;bottom:16px}
  #stick{bottom:16px}
  #sheet{left:auto;top:0;width:320px;height:100%;border-radius:14px 0 0 14px;border-top:0;border-left:1px solid var(--edge);transform:translateX(105%)}
  #sheet.open{transform:none}
  #sheet-handle{display:none}
  #sheet-top{padding-top:8px}
}
</style>
</head>
<body data-control="tap">
<canvas id="view" tabindex="0" aria-label="Metro view"></canvas>
<div id="ui">
  <header id="topbar"><button id="back" type="button" aria-label="Back to globe">‹ Globe</button><div id="place">Kenai · 60.5N</div><button id="gear" type="button" aria-label="Settings">⚙</button></header>
  <div id="hud"></div>
  <div id="stick" aria-label="Move stick"><div id="knob"></div></div>
  <div id="rbtns"><button id="run" type="button">Run</button><button id="rot" type="button" aria-label="Rotate camera" style="display:none">🎥</button></div>
  <nav id="quick" aria-label="Quick toggles">
    <button class="qchip" id="q-cam" type="button"><span>Cam</span><b>—</b></button>
    <button class="qchip" id="q-look" type="button"><span>Look</span><b>—</b></button>
    <button class="qchip" id="q-scale" type="button"><span>Scale</span><b>—</b></button>
    <button class="qchip" id="q-trees" type="button"><span>Trees</span><b>—</b></button>
    <button class="qchip" id="q-time" type="button"><span>Time</span><b>—</b></button>
  </nav>
  <section id="sheet" aria-label="Settings">
    <div id="sheet-handle"></div>
    <div id="sheet-top"><button id="reset" type="button">Reset to defaults</button><h2>Settings</h2><button id="copy" type="button">Copy settings</button><button id="sheet-x" type="button" aria-label="Close">✕</button></div>
    <div id="sheet-body"></div>
  </section>
  <div id="toast"></div>
</div>
<!-- ===================== /METRO UI ===================== -->

#mockbar-v23-layer{z-index:5;display:none;touch-action:none;}
#mockbar-v23-layer.mockbar-v23-armed{pointer-events:auto;cursor:crosshair;touch-action:none;}
#mockbar-v23-overlays{z-index:18;overflow:hidden;pointer-events:none;}
#mockbar-v23-bar{
  position:fixed;left:8px;bottom:8px;z-index:20;pointer-events:auto;
  display:flex;flex-direction:column;flex-wrap:nowrap;gap:4px;align-items:center;
  max-height:calc(100vh - 16px);overflow-x:hidden;overflow-y:auto;
  font-family:var(--mockbar-font);
  color:var(--mockbar-text);
  user-select:none;-webkit-user-select:none;
}
#mockbar-v23-bar .mockbar-v23-chip{
  box-sizing:border-box;margin:0;font:inherit;font-size:12px;line-height:1;
  min-height:40px;min-width:40px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:4px;
  border:1px solid var(--mockbar-border);border-radius:8px;color:var(--mockbar-text);
  background:rgba(35,24,17,0.3);cursor:pointer;opacity:1;transition:background 0.12s ease;
  flex:0 0 auto;
}
#mockbar-v23-bar .mockbar-v23-chip:focus-visible{outline:2px solid var(--mockbar-text);outline-offset:2px;}
#mockbar-v23-bar .mockbar-v23-dot{
  width:14px;height:14px;border-radius:7px;display:inline-block;opacity:1;
  box-shadow:0 0 0 1px var(--mockbar-border-strong);
}
#mockbar-v23-bar .mockbar-v23-status{
  font-size:11px;color:var(--mockbar-text-muted);opacity:1;
  text-align:center;max-width:7.5em;line-height:1.25;
}
#mockbar-v23-bar .mockbar-v23-dev{display:flex;flex-direction:column;flex-wrap:nowrap;gap:4px;align-items:stretch;}
#mockbar-v23-bar .mockbar-v23-grip{
  box-sizing:border-box;margin:0;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  width:40px;min-height:24px;padding:4px 0;
  border-radius:8px;color:var(--mockbar-text-muted);
  cursor:grab;touch-action:none;
  background:transparent;border:0;
}
#mockbar-v23-bar .mockbar-v23-grip:focus-visible{outline:2px solid var(--mockbar-text);outline-offset:2px;}
#mockbar-v23-bar.mockbar-v23-dragging,
#mockbar-v23-bar.mockbar-v23-dragging .mockbar-v23-grip{cursor:grabbing;}
#mockbar-v23-sr{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip-path:inset(50%);border:0;
}
</style>
<div id="mockbar-v23-root">
  <canvas id="mockbar-v23-layer" aria-hidden="true"></canvas>
  <div id="mockbar-v23-overlays" aria-hidden="true"></div>
  <div id="mockbar-v23-bar" role="group" aria-label="Mock highlighter"></div>
</div>
<script>
(function(){
  if(window.__MOCKBAR_V23__)return;
  window.__MOCKBAR_V23__=true;
  var HL=[['Yellow','#ffd400'],['Green','#22c55e'],['Red','#ef4444']];
  var MOCK_BAR_VERSION='Mock bar v2.3';
  var MOCK_BAR_DATE='2026-11-10';
  var MOCK_CHIP_BG_ALPHA=0.3;
  var MARGIN=8;
  var MOVE_THRESH=6;
  var POS_KEY='mockbar-v23-pos';
  var ICONS={
    pen:'M15 5l4 4M4 15 15.5 3.5a2.8 2.8 0 0 1 4 4L8 19l-5 2 1-6Z',
    done:'M5 12l4 4L19 6',
    undo:'M9 5 4 10l5 5M4 10h9a7 7 0 0 1 7 7v2',
    clear:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7',
    dev:'M8 5 4 12l4 7M16 5l4 7-4 7M10 19l4-14'
  };
  function mockBgAlpha(css,a){
    var m=/^#([0-9a-f]{6})$/i.exec((css||'').trim());
    if(!m)return 'rgba(128,128,128,'+a+')';
    var n=parseInt(m[1],16);
    return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
  }
  function cssVar(name, fallback){
    var v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v||fallback;
  }
  function themeBg(){return cssVar('--theme-bg-base','#231811');}
  function themeText(){return cssVar('--theme-text-primary','#F2E6C9');}
  function themeBorder(){return cssVar('--theme-border-default','#8A5A2B');}
  function iconSvg(kind){
    var ns='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(ns,'svg');
    svg.setAttribute('aria-hidden','true');
    svg.setAttribute('focusable','false');
    svg.setAttribute('width','18');
    svg.setAttribute('height','18');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor');
    svg.setAttribute('stroke-width','1.8');
    svg.setAttribute('stroke-linecap','round');
    svg.setAttribute('stroke-linejoin','round');
    svg.style.opacity='1';
    var path=document.createElementNS(ns,'path');
    path.setAttribute('d',ICONS[kind]);
    svg.appendChild(path);
    return svg;
  }
  function paintStrokesOn(g,strokes,w,h){
    g.lineCap='round';g.lineJoin='round';g.lineWidth=14;g.globalAlpha=0.4;
    strokes.forEach(function(s){
      if(!s.p.length)return;
      g.strokeStyle=s.c;g.beginPath();
      g.moveTo(s.p[0][0]*w,s.p[0][1]*h);
      s.p.forEach(function(q){g.lineTo(q[0]*w+(s.p.length===1?0.1:0),q[1]*h);});
      g.stroke();
    });
    g.globalAlpha=1;
    strokes.forEach(function(s,i){
      if(!s.p.length)return;
      var x=s.p[0][0]*w,y=s.p[0][1]*h,n=String(i+1);
      g.fillStyle='#111';g.beginPath();g.arc(x,y,10,0,7);g.fill();
      g.fillStyle='#fff';g.font='bold 11px system-ui,sans-serif';
      g.textAlign='center';g.textBaseline='middle';g.fillText(n,x,y+0.5);
    });
  }

  var hlOpen=false, hlColor=0, frozen=null, strokes=[], devOpen=false;
  var dev={boxes:false,grid:false,size:false,tap:false,overflow:false,stamp:false};
  var live=null;
  var overlayTimer=0;
  var skipClick=false;
  var memPos=null;
  var pos=null;
  var current=null;

  var root=document.getElementById('mockbar-v23-root');
  var layer=document.getElementById('mockbar-v23-layer');
  var overlays=document.getElementById('mockbar-v23-overlays');
  var bar=document.getElementById('mockbar-v23-bar');
  if(!root||!layer||!overlays||!bar)return;

  function viewportSize(){
    var vv=window.visualViewport;
    return {w:vv?vv.width:window.innerWidth,h:vv?vv.height:window.innerHeight};
  }
  function readStoredPos(){
    try{
      var raw=sessionStorage.getItem(POS_KEY);
      if(raw){
        var p=JSON.parse(raw);
        if(p&&typeof p.left==='number'&&typeof p.bottom==='number'&&isFinite(p.left)&&isFinite(p.bottom))
          return {left:p.left,bottom:p.bottom};
      }
    }catch(e){
      if(memPos)return {left:memPos.left,bottom:memPos.bottom};
    }
    return memPos?{left:memPos.left,bottom:memPos.bottom}:null;
  }
  function persistPos(){
    if(!current)return;
    var data={left:current.left,bottom:current.bottom};
    pos=data;
    memPos=data;
    try{sessionStorage.setItem(POS_KEY,JSON.stringify(data));}catch(e){}
  }
  function applyPlace(){
    var vp=viewportSize();
    var maxH=Math.max(40,vp.h-MARGIN*2);
    bar.style.maxHeight=maxH+'px';
    var w=bar.offsetWidth,h=bar.offsetHeight;
    var left,bottom;
    if(pos&&isFinite(pos.left)&&isFinite(pos.bottom)){left=pos.left;bottom=pos.bottom;}
    else {left=MARGIN;bottom=MARGIN;}
    var top=vp.h-bottom-h;
    var maxX=Math.max(MARGIN,vp.w-w-MARGIN);
    var maxY=Math.max(MARGIN,vp.h-h-MARGIN);
    left=Math.min(Math.max(MARGIN,left),maxX);
    top=Math.min(Math.max(MARGIN,top),maxY);
    bottom=vp.h-top-h;
    bar.style.left=left+'px';
    bar.style.top=top+'px';
    bar.style.right='auto';
    bar.style.bottom='auto';
    current={left:left,top:top,bottom:bottom,w:w,h:h};
  }
  function onViewportChange(){
    applyPlace();
    if(pos)persistPos();
    if(hlOpen)paintLayer();
  }

  function drawArmed(){return hlOpen && hlColor!==null;}

  function paintLayer(){
    if(!hlOpen){layer.style.display='none';return;}
    layer.style.display='block';
    var r=layer.getBoundingClientRect();
    var d=Math.min(2,window.devicePixelRatio||1);
    var W=Math.round(r.width*d),H=Math.round(r.height*d);
    if(layer.width!==W||layer.height!==H){layer.width=W;layer.height=H;}
    var g=layer.getContext('2d');if(!g)return;
    g.setTransform(d,0,0,d,0,0);
    g.clearRect(0,0,r.width,r.height);
    var all=live?strokes.concat([live.s]):strokes;
    paintStrokesOn(g,all,r.width,r.height);
  }

  function setLayerArmed(){
    var armed=drawArmed();
    layer.classList.toggle('mockbar-v23-armed',armed);
    layer.setAttribute('aria-label', armed ? 'Highlighter drawing layer' : 'Highlighter marks (drawing paused — select a color)');
    layer.setAttribute('aria-disabled', armed?'false':'true');
    layer.setAttribute('aria-hidden', hlOpen?'false':'true');
  }

  function pt(e){
    var r=layer.getBoundingClientRect();
    return [(e.clientX-r.left)/(r.width||1),(e.clientY-r.top)/(r.height||1)];
  }
  layer.addEventListener('pointerdown',function(e){
    if(!drawArmed())return;
    e.preventDefault();
    if(live||(e.pointerType==='mouse'&&e.button!==0))return;
    try{layer.setPointerCapture(e.pointerId);}catch(_e){}
    live={id:e.pointerId,s:{c:HL[hlColor][1],p:[pt(e)]}};
    paintLayer();
  });
  layer.addEventListener('pointermove',function(e){
    if(!live||live.id!==e.pointerId)return;
    live.s.p.push(pt(e));
    paintLayer();
  });
  function endPtr(e){
    if(!live||live.id!==e.pointerId)return;
    var s=live.s;live=null;
    strokes=strokes.concat([s]);
    paintLayer();
  }
  layer.addEventListener('pointerup',endPtr);
  layer.addEventListener('pointercancel',endPtr);
  layer.addEventListener('lostpointercapture',endPtr);
  window.addEventListener('resize',onViewportChange);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',onViewportChange);
    window.visualViewport.addEventListener('scroll',onViewportChange);
  }

  function chip(opts){
    var b=document.createElement('button');
    b.type='button';
    b.className='mockbar-v23-chip';
    if(opts.label)b.setAttribute('aria-label',opts.label);
    if(opts.title)b.title=opts.title;
    if(opts.pressed!=null)b.setAttribute('aria-pressed',opts.pressed?'true':'false');
    if(opts.expanded!=null)b.setAttribute('aria-expanded',opts.expanded?'true':'false');
    if(opts.describedBy)b.setAttribute('aria-describedby',opts.describedBy);
    var bg=themeBg();
    var border=opts.border || ('1px solid '+themeBorder());
    b.style.border=border;
    b.style.fontWeight=opts.weight||'400';
    if(opts.outline){b.style.outline=opts.outline;b.style.outlineOffset=opts.outlineOffset||'1px';}
    else {b.style.outline='none';}
    function rest(){b.style.background=mockBgAlpha(bg,MOCK_CHIP_BG_ALPHA);b.style.opacity='1';b.style.color=themeText();}
    function hot(){b.style.background=bg;b.style.opacity='1';b.style.color=themeText();}
    rest();
    b.addEventListener('pointerenter',hot);
    b.addEventListener('pointerleave',rest);
    b.addEventListener('focus',hot);
    b.addEventListener('blur',rest);
    b.addEventListener('pointerdown',hot);
    if(opts.onClick)b.addEventListener('click',opts.onClick);
    if(opts.el)b.appendChild(opts.el);
    if(opts.text)b.appendChild(document.createTextNode(opts.text));
    return b;
  }

  function bindDrag(el, asToggle){
    el.style.touchAction='none';
    el.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      var pid=e.pointerId;
      try{el.setPointerCapture(pid);}catch(_e){}
      var sx=e.clientX,sy=e.clientY;
      var r=bar.getBoundingClientRect();
      var sl=r.left,st=r.top,sh=r.height;
      var didMove=false;
      function move(ev){
        if(ev.pointerId!==pid)return;
        var dx=ev.clientX-sx,dy=ev.clientY-sy;
        if(!didMove&&Math.hypot(dx,dy)<MOVE_THRESH)return;
        didMove=true;
        ev.preventDefault();
        bar.classList.add('mockbar-v23-dragging');
        var vp=viewportSize();
        pos={left:sl+dx,bottom:vp.h-(st+dy)-sh};
        applyPlace();
      }
      function up(ev){
        if(ev.pointerId!==pid)return;
        el.removeEventListener('pointermove',move);
        el.removeEventListener('pointerup',up);
        el.removeEventListener('pointercancel',up);
        window.removeEventListener('pointermove',move);
        window.removeEventListener('pointerup',up);
        window.removeEventListener('pointercancel',up);
        try{el.releasePointerCapture(pid);}catch(_e){}
        bar.classList.remove('mockbar-v23-dragging');
        if(didMove){skipClick=true;persistPos();}
      }
      el.addEventListener('pointermove',move);
      el.addEventListener('pointerup',up);
      el.addEventListener('pointercancel',up);
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
      window.addEventListener('pointercancel',up);
    });
    if(asToggle){
      el.addEventListener('click',function(e){
        if(skipClick){e.preventDefault();e.stopPropagation();skipClick=false;return;}
        openHl();
      });
    }
  }

  function hostRoot(){return document.documentElement;}

  function paintOverlays(){
    overlays.innerHTML='';
    if(!hlOpen)return;
    var flags=dev;
    if(!flags.boxes&&!flags.grid&&!flags.size&&!flags.tap&&!flags.overflow&&!flags.stamp)return;
    var w=window.visualViewport?window.visualViewport.width:window.innerWidth;
    var h=window.visualViewport?window.visualViewport.height:window.innerHeight;
    var land=w>=h;
    var rootEl=hostRoot();
    var rr=rootEl.getBoundingClientRect();
    if(flags.grid){
      var g=document.createElement('div');
      g.style.cssText='position:absolute;inset:0;background-image:linear-gradient(to right, rgba(56,189,248,0.18) 1px, transparent 1px), linear-gradient(to bottom, rgba(56,189,248,0.18) 1px, transparent 1px);background-size:8px 8px;box-shadow:inset 12px 0 0 rgba(251,191,36,0.12), inset -12px 0 0 rgba(251,191,36,0.12), inset 0 12px 0 rgba(251,191,36,0.12), inset 0 -12px 0 rgba(251,191,36,0.12)';
      overlays.appendChild(g);
    }
    function boxesOf(sel, pred, styleFn){
      if(!rootEl)return;
      Array.prototype.forEach.call(rootEl.querySelectorAll(sel),function(el){
        if(el.closest('#mockbar-v23-root'))return;
        var b=el.getBoundingClientRect();
        var rec={l:b.left-rr.left,t:b.top-rr.top,w:b.width,h:b.height};
        if(!pred(rec,el))return;
        var d=document.createElement('div');
        d.style.position='absolute';
        d.style.left=rec.l+'px';d.style.top=rec.t+'px';
        d.style.width=rec.w+'px';d.style.height=rec.h+'px';
        d.style.boxSizing='border-box';
        d.style.pointerEvents='none';
        styleFn(d,rec);
        overlays.appendChild(d);
      });
    }
    if(flags.boxes){
      boxesOf('header,nav,main,section,footer,aside,[role="dialog"],[role="region"],[role="group"]',
        function(b){return b.w>8&&b.h>8;},
        function(d){d.style.background='rgba(34,197,94,0.08)';d.style.outline='2px solid rgba(34,197,94,0.85)';d.style.outlineOffset='-1px';});
    }
    if(flags.tap){
      boxesOf('button,a,input,select,textarea,[role="button"]',
        function(b){return b.w>0&&b.h>0&&Math.min(b.w,b.h)<44;},
        function(d){d.style.outline='2px dashed #f97316';d.style.outlineOffset='1px';});
    }
    if(flags.overflow){
      boxesOf('p,span,strong,label,li,h1,h2,h3,h4,td,th,button,a',
        function(b,el){return el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1;},
        function(d,rec){d.style.width=Math.max(rec.w,4)+'px';d.style.height=Math.max(rec.h,4)+'px';d.style.outline='2px solid #ef4444';d.style.background='rgba(239,68,68,0.12)';});
    }
    if(flags.size){
      var s=document.createElement('div');
      s.style.cssText='position:absolute;left:8px;top:8px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;font-family:'+cssVar('--theme-font-family','system-ui,sans-serif');
      s.textContent=Math.round(w)+'\u00d7'+Math.round(h)+' \u00b7 '+(land?'landscape':'portrait');
      overlays.appendChild(s);
    }
    if(flags.stamp){
      var st=document.createElement('div');
      st.style.cssText='position:absolute;right:8px;bottom:8px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;font-family:'+cssVar('--theme-font-family','system-ui,sans-serif');
      st.textContent='App Mockup \u00b7 '+MOCK_BAR_VERSION+' \u00b7 '+MOCK_BAR_DATE;
      overlays.appendChild(st);
    }
  }

  function startOverlayLoop(){
    stopOverlayLoop();
    paintOverlays();
    overlayTimer=window.setInterval(paintOverlays,500);
    window.addEventListener('resize',paintOverlays);
    if(window.visualViewport)window.visualViewport.addEventListener('resize',paintOverlays);
  }
  function stopOverlayLoop(){
    if(overlayTimer){window.clearInterval(overlayTimer);overlayTimer=0;}
    window.removeEventListener('resize',paintOverlays);
    if(window.visualViewport)window.visualViewport.removeEventListener('resize',paintOverlays);
    overlays.innerHTML='';
  }

  function openHl(){
    frozen='';
    strokes=[];
    hlColor=0;
    devOpen=false;
    live=null;
    hlOpen=true;
    setLayerArmed();
    paintLayer();
    startOverlayLoop();
    renderBar();
  }
  function closeHl(){
    hlOpen=false;
    frozen=null;
    strokes=[];
    devOpen=false;
    hlColor=0;
    live=null;
    setLayerArmed();
    paintLayer();
    stopOverlayLoop();
    renderBar();
  }
  function toggleSwatch(i){
    hlColor=(hlColor===i)?null:i;
    if(!drawArmed()&&live){live=null;}
    setLayerArmed();
    paintLayer();
    renderBar();
  }
  function undoStroke(){strokes=strokes.slice(0,-1);paintLayer();}
  function clearStrokes(){strokes=[];paintLayer();}

  function gripEl(){
    var g=document.createElement('button');
    g.type='button';
    g.className='mockbar-v23-grip';
    g.setAttribute('aria-label','Drag to move Mock bar');
    g.title='Drag';
    var ns='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(ns,'svg');
    svg.setAttribute('aria-hidden','true');
    svg.setAttribute('focusable','false');
    svg.setAttribute('width','18');
    svg.setAttribute('height','12');
    svg.setAttribute('viewBox','0 0 18 12');
    svg.setAttribute('fill','currentColor');
    var dots=[[3,2],[9,2],[15,2],[3,10],[9,10],[15,10]];
    dots.forEach(function(p){
      var c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',String(p[0]));
      c.setAttribute('cy',String(p[1]));
      c.setAttribute('r','1.6');
      svg.appendChild(c);
    });
    g.appendChild(svg);
    bindDrag(g,false);
    return g;
  }

  function renderBar(){
    bar.innerHTML='';
    if(!hlOpen){
      var open=chip({label:'Open Mock highlighter',title:'Mock',weight:'600'});
      open.appendChild(iconSvg('pen'));
      var lab=document.createElement('span');
      lab.style.marginLeft='2px';lab.style.opacity='1';
      lab.textContent='Mock';
      open.appendChild(lab);
      bindDrag(open,true);
      bar.appendChild(open);
      applyPlace();
      return;
    }
    bar.appendChild(gripEl());
    bar.appendChild(chip({
      label:'Done — close highlighter and restore controls',
      title:'Done',weight:'600',describedBy:'mockbar-v23-sr',onClick:closeHl,el:iconSvg('done')
    }));
    HL.forEach(function(h,i){
      var sel=hlColor===i;
      var dot=document.createElement('span');
      dot.className='mockbar-v23-dot';
      dot.setAttribute('aria-hidden','true');
      dot.style.background=h[1];
      var c=chip({
        label:sel? h[0]+', selected — tap to deselect' : h[0]+', tap to select',
        title:sel? h[0]+' (selected — tap to deselect)' : h[0],
        pressed:sel,
        weight:sel?'700':'400',
        border:sel?('2px solid '+themeText()):('1px dashed '+themeBorder()),
        outline:sel?('2px solid '+h[1]):undefined,
        onClick:function(){toggleSwatch(i);},
        el:dot
      });
      bar.appendChild(c);
    });
    bar.appendChild(chip({label:'Undo last mark',title:'Undo',onClick:undoStroke,el:iconSvg('undo')}));
    bar.appendChild(chip({label:'Clear all marks',title:'Clear',onClick:clearStrokes,el:iconSvg('clear')}));
    bar.appendChild(chip({
      label:'Dev overlays',title:'Dev',expanded:devOpen,pressed:devOpen,
      weight:devOpen?'700':'400',
      border:devOpen?('2px solid '+themeText()):('1px solid '+themeBorder()),
      onClick:function(){devOpen=!devOpen;renderBar();},
      el:iconSvg('dev')
    }));
    if(devOpen){
      var grp=document.createElement('span');
      grp.className='mockbar-v23-dev';
      grp.setAttribute('role','group');
      grp.setAttribute('aria-label','Dev overlay toggles');
      function devChip(key,title,text){
        var on=dev[key];
        return chip({
          title:title,pressed:on,text:text,
          weight:on?'700':'400',
          border:on?('2px solid '+themeText()):('1px solid '+themeBorder()),
          onClick:function(){dev[key]=!dev[key];paintOverlays();renderBar();}
        });
      }
      grp.appendChild(devChip('boxes','Show boxes','Boxes'));
      grp.appendChild(devChip('grid','Layout grid','Grid'));
      grp.appendChild(devChip('size','Screen size','Size'));
      grp.appendChild(devChip('tap','Tap targets under 44px','Tap'));
      grp.appendChild(devChip('overflow','Text overflow','Overflow'));
      grp.appendChild(devChip('stamp','Version stamp','Stamp'));
      bar.appendChild(grp);
    }
    var st=document.createElement('span');
    st.className='mockbar-v23-status';
    st.setAttribute('role','status');
    st.textContent=drawArmed()?('Drawing: '+HL[hlColor][0]):'No color — page free to scroll/tap';
    bar.appendChild(st);
    var sr=document.createElement('span');
    sr.id='mockbar-v23-sr';
    sr.className='';
    sr.style.cssText='position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);border:0';
    sr.textContent=(frozen?'View frozen. ':'Snapshot unavailable; live view shown, gestures blocked. ')+(drawArmed()?'Drawing armed. ':'No swatch selected; overlay ignores pointers. ')+'Tap selected swatch to deselect. Screenshot to capture marks.';
    bar.appendChild(sr);
    applyPlace();
  }

  var ro=typeof ResizeObserver!=='undefined'?new ResizeObserver(function(){if(hlOpen)paintLayer();}):null;
  if(ro)ro.observe(layer);
  pos=readStoredPos();
  renderBar();
})();
</script>
