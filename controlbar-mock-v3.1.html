<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Landbox control bar v3.1 — layout mockup – sample</title>
  <style>
    :root {
      --bg: #14110e;
      --surface: #221c16;
      --ink: #f3eadb;
      --muted: #b3a48e;
      --dim: #8a7a66;
      --line: #3c3228;
      --accent: #e0b15a;
      --chip: #2a241c;
      --fill: #1a1612;
      --fill-2: #3a3124;
      --accent-soft: rgba(224, 177, 90, 0.16);
      --accent-line: #4a3d30;
      --on: #14110e;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      --tap: 48px;
      --tap-sm: 44px;
      --mock-gap: 84px;
      --radius: 14px;
      --dock-h: 64px;
      --pad: 8px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow: hidden;
    }
    button, input { font: inherit; color: inherit; }
    button {
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .app {
      height: 100%;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    .stage {
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 80% at 50% 40%, #221c16 0%, #14110e 70%);
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }
    .stage.painting { cursor: crosshair; }
    .world {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 88px 72px 88px 16px;
    }
    .orb-wrap {
      position: relative;
      display: grid;
      place-items: center;
    }
    .orb {
      position: relative;
      width: min(58vh, 48vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 28% 26%, rgba(243,234,219,.22), transparent 32%),
        radial-gradient(ellipse 42% 32% at 64% 36%, #d7b483 0 38%, transparent 42%),
        radial-gradient(ellipse 58% 50% at 36% 52%, #6f8f45 0 48%, transparent 54%),
        radial-gradient(ellipse 34% 28% at 72% 64%, #2c5a38 0 40%, transparent 46%),
        radial-gradient(circle at 50% 50%, #3a6a7c 0 66%, #143240 100%);
      box-shadow:
        inset -18px -12px 40px rgba(0,0,0,.45),
        0 0 0 1px rgba(243,234,219,.10),
        0 20px 50px rgba(0,0,0,.5);
      transform: scale(var(--z, 1)) translate(var(--pan-x, 0px), var(--pan-y, 0px));
    }
    .orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0.34;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='p' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.78  0 0 0 0 0.62  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
      background-size: 160px 160px;
    }
    .app[data-view="country"] .orb {
      width: min(78vh, 68vw, 480px);
      border-radius: 18px;
      background:
        radial-gradient(circle at 30% 22%, rgba(243,234,219,.14), transparent 42%),
        radial-gradient(ellipse 50% 40% at 40% 45%, #6f8f45 0 50%, transparent 54%),
        radial-gradient(ellipse 30% 22% at 68% 38%, #d7b483 0 40%, transparent 46%),
        linear-gradient(160deg, #3a6a7c 0%, #143240 40%, #2c5a38 100%);
    }
    .app[data-view="metro"] .orb {
      width: min(88vh, 80vw, 560px);
      border-radius: 8px;
      background:
        radial-gradient(circle at 48% 42%, #6f8f45 0 18%, transparent 22%),
        radial-gradient(ellipse 40% 20% at 58% 48%, #d7b483 0 30%, transparent 36%),
        radial-gradient(ellipse 70% 50% at 40% 60%, #2c5a38 0 50%, transparent 56%),
        linear-gradient(160deg, #3a6a7c, #143240);
    }
    .watermark {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      text-align: center;
      color: rgba(243,234,219,.94);
      text-shadow: 0 1px 8px rgba(0,0,0,.65);
    }
    .watermark .tag {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #d7c4a3;
      background: rgba(20,17,14,.78);
      border: 1px solid var(--accent-line);
      border-radius: 999px;
      padding: 4px 10px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .watermark .who {
      display: block;
      font-family: Palatino, Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 15px;
      font-weight: 700;
    }
    .marks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .mark {
      position: absolute;
      width: var(--s, 28px);
      height: var(--s, 28px);
      margin: calc(var(--s, 28px) / -2) 0 0 calc(var(--s, 28px) / -2);
      border-radius: 50%;
      background: var(--c, rgba(224,177,90,.55));
      box-shadow: 0 0 0 2px rgba(20,17,14,.45);
      display: grid;
      place-items: center;
      color: var(--on);
      font-size: 12px;
      font-weight: 700;
    }
    .mark.raise { background: #e0b15a; }
    .mark.lower { background: #c4a15a; }
    .mark.paint { border-radius: 40% 60% 50% 50%; }

    .history {
      position: absolute;
      top: var(--pad);
      left: var(--pad);
      z-index: 8;
      display: flex;
      gap: 4px;
      background: var(--fill);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .history .big {
      min-width: var(--tap);
      min-height: var(--tap);
      padding: 2px 4px 0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      color: var(--ink);
    }
    .history .big svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .history .big span {
      font-size: 9px;
      letter-spacing: 0.02em;
      color: var(--muted);
      line-height: 1;
    }
    .history .big:disabled,
    .history .big[aria-disabled="true"] {
      opacity: 0.38;
      cursor: default;
    }
    .history .big {
      background: var(--chip);
      border: 1px solid var(--accent-line);
    }
    .history .big:not(:disabled):not([aria-disabled="true"]):active {
      background: var(--fill-2);
      border-color: var(--accent);
    }

    .youare {
      position: absolute;
      top: var(--pad);
      left: 176px;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--fill);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 6px 10px 6px 6px;
      box-shadow: var(--shadow);
      pointer-events: none;
      min-height: 56px;
    }
    .ya-stack {
      width: 44px;
      height: 44px;
      position: relative;
      flex: 0 0 44px;
    }
    .ya-globe, .ya-country, .ya-metro {
      position: absolute;
      border: 2px solid rgba(74,61,48,.7);
      background: rgba(62,115,140,.4);
    }
    .ya-globe {
      inset: 0;
      border-radius: 50%;
    }
    .ya-country {
      inset: 9px 6px 6px 6px;
      border-radius: 6px;
    }
    .ya-metro {
      width: 10px;
      height: 10px;
      left: 17px;
      top: 18px;
      border-radius: 2px;
      background: rgba(62,115,140,.4);
    }
    .youare[data-view="globe"] .ya-globe,
    .youare[data-view="country"] .ya-country,
    .youare[data-view="metro"] .ya-metro {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .youare[data-view="metro"] .ya-metro { background: var(--accent); }
    .ya-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .ya-meta strong {
      font-family: Palatino, Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.1;
    }
    .ya-meta em {
      font-style: normal;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .tools {
      position: absolute;
      top: 50%;
      right: var(--pad);
      transform: translateY(-50%);
      z-index: 8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      background: var(--fill);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .tool {
      min-width: var(--tap);
      min-height: var(--tap);
      padding: 2px 4px 0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      color: var(--ink);
      position: relative;
      background: var(--chip);
      border: 1px solid var(--accent-line);
    }
    .tool svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tool span {
      font-size: 9px;
      letter-spacing: 0.02em;
      color: var(--muted);
      line-height: 1;
    }
    .tool[aria-pressed="true"] {
      background: var(--fill-2);
      border-color: var(--accent);
      color: var(--accent);
    }
    .tool[aria-pressed="true"] span { color: var(--accent); }
    .tool .mini {
      position: absolute;
      top: 3px;
      right: 3px;
      display: flex;
      flex-direction: column;
      width: 12px;
      gap: 1px;
    }
    .tool .mini i {
      display: block;
      width: 12px;
      height: 9px;
      border-radius: 2px;
      background: var(--fill-2);
      color: var(--muted);
      font-style: normal;
      font-size: 8px;
      line-height: 9px;
      text-align: center;
    }
    .tool .mini i.on {
      background: var(--accent);
      color: var(--on);
    }

    .flyout {
      display: none;
      position: absolute;
      right: 68px;
      top: 72px;
      z-index: 10;
      background: var(--surface);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      min-width: 168px;
      max-width: 220px;
    }
    .flyout.open { display: block; }
    .flyout h4 {
      margin: 0 0 8px;
      font-family: Palatino, Georgia, serif;
      font-size: 14px;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
      font-weight: 600;
    }
    .seg {
      display: flex;
      background: var(--fill-2);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .seg button {
      flex: 1;
      min-height: var(--tap-sm);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .seg button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--on);
    }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch {
      width: var(--tap-sm);
      height: var(--tap-sm);
      border-radius: 10px;
      border: 2px solid transparent;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
    }
    .swatch[aria-pressed="true"] { border-color: var(--accent); }
    .hint {
      margin: 8px 0 0;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }
    .km, .val {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      white-space: nowrap;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 28px;
      flex: 1;
      min-width: 80px;
      background: transparent;
      margin: 0;
      accent-color: var(--accent);
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 999px; background: var(--fill-2);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px; margin-top: -8px;
      border-radius: 50%; background: var(--accent); border: 2px solid #f3eadb; cursor: pointer;
    }
    input[type="range"]::-moz-range-track {
      height: 6px; border-radius: 999px; background: var(--fill-2); border: 0;
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent); border: 2px solid #f3eadb;
    }

    .dock {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      bottom: var(--pad);
      z-index: 8;
      display: flex;
      align-items: stretch;
      gap: 6px;
      min-height: var(--tap);
      padding-left: var(--mock-gap);
    }
    .play {
      min-width: 52px;
      min-height: var(--tap);
      border-radius: 14px;
      background: var(--accent);
      color: var(--on);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      flex: 0 0 52px;
    }
    .play svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
    .play[aria-pressed="true"] {
      background: var(--fill-2);
      color: var(--accent);
      border: 1px solid var(--accent-line);
    }
    .timeline-wrap {
      flex: 1;
      min-width: 0;
      background: var(--fill);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 6px 12px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      box-shadow: var(--shadow);
    }
    .tl-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .tl-year {
      font-family: Palatino, Georgia, serif;
      color: var(--ink);
      font-weight: 700;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .track {
      position: relative;
      height: 28px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .rail {
      position: absolute;
      left: 0; right: 0;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #3c3228, #6a5a48 40%, #e0b15a);
    }
    .tl-fill {
      position: absolute;
      left: 0;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      width: 70%;
    }
    .ticks { position: absolute; inset: 0; pointer-events: none; }
    .ticks i {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 14px;
      margin-top: -7px;
      background: rgba(243,234,219,.28);
    }
    .head {
      position: absolute;
      top: 50%;
      width: 22px;
      height: 22px;
      margin: -11px 0 0 -11px;
      border-radius: 50%;
      background: var(--ink);
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(20,17,14,.55);
      left: 70%;
    }
    .sea-chip {
      flex: 0 0 auto;
      min-width: var(--tap);
      min-height: var(--tap);
      background: var(--chip);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 4px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      box-shadow: var(--shadow);
      color: var(--ink);
    }
    .sea-chip svg {
      width: 18px; height: 18px;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .sea-chip span { font-size: 9px; color: var(--muted); line-height: 1; }
    .sea-chip .val { font-size: 11px; color: var(--accent); }
    .sea-chip[aria-pressed="true"] {
      background: var(--fill-2);
      border-color: var(--accent);
    }
    .sea-fly {
      display: none;
      position: absolute;
      left: var(--mock-gap);
      right: 68px;
      bottom: 72px;
      z-index: 10;
      background: rgba(34,28,22,.88);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .sea-fly.open { display: flex; align-items: center; gap: 10px; }

    .sheet-back {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(20,17,14,.12);
      z-index: 12;
    }
    .sheet-back.open { display: block; }
    .sheet {
      position: absolute;
      left: var(--pad);
      right: 68px;
      top: 70px;
      bottom: 72px;
      max-height: none;
      overflow: auto;
      background: rgba(34, 28, 22, 0.58);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 12px 12px 16px;
      box-shadow: var(--shadow);
      z-index: 13;
      display: none;
      backdrop-filter: blur(8px) saturate(1.05);
      -webkit-backdrop-filter: blur(8px) saturate(1.05);
    }
    .sheet.open { display: block; }
    .sheet h3 {
      margin: 10px 0 6px;
      font-family: Palatino, Georgia, serif;
      font-size: 16px;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(20,17,14,.9);
    }
    .sheet h3:first-child { margin-top: 0; }
    .grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .sheet .tool { background: rgba(42, 36, 28, 0.92); width: 56px; }
    .layers { display: flex; flex-direction: column; gap: 2px; }
    .layer {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: var(--tap-sm);
      padding: 0 8px;
      border-radius: 10px;
      color: var(--ink);
      font-size: 13px;
      text-shadow: 0 1px 3px rgba(20,17,14,.9);
    }
    .layer .dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--accent); background: var(--accent); flex: 0 0 18px;
    }
    .layer[aria-pressed="false"] .dot { background: transparent; }
    .layer[aria-pressed="false"] { color: var(--muted); }

    .toast {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      background: #3a3124;
      border: 1px solid var(--accent);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    @media (orientation: landscape) {
      .world { padding: 64px 72px 72px 16px; }
      .orb { width: min(52vh, 36vw, 240px); }
      .app[data-view="country"] .orb,
      .app[data-view="metro"] .orb { width: min(70vh, 50vw, 340px); }
      .youare { left: 176px; min-height: 48px; padding: 4px 8px 4px 4px; }
      .ya-stack { width: 36px; height: 36px; flex-basis: 36px; }
      .ya-metro { width: 8px; height: 8px; left: 14px; top: 14px; }
      .tl-meta { justify-content: center; }
      .tl-meta span:not(.tl-year) { display: none; }
      .timeline-wrap { padding: 2px 12px 4px; }
      .track { height: 24px; }
      .dock { right: 68px; }
      .sheet { right: 68px; top: 66px; }
      .history .big { min-width: var(--tap-sm); min-height: var(--tap-sm); }
      .tool { min-width: var(--tap-sm); min-height: var(--tap-sm); }
    }

    @media (orientation: portrait) {
      .world { padding: 120px 72px 96px 16px; }
      .orb { width: min(72vw, 40vh); }
      .app[data-view="country"] .orb,
      .app[data-view="metro"] .orb { width: min(82vw, 44vh); }
    }
  
    .help-btn {
      position: absolute;
      top: var(--pad);
      right: var(--pad);
      z-index: 8;
      width: var(--tap);
      height: var(--tap);
      border-radius: 10px;
      background: var(--chip);
      border: 1px solid var(--accent-line);
      box-shadow: var(--shadow);
      color: var(--accent);
      font-family: Palatino, Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      display: grid;
      place-items: center;
    }
    .help-btn[aria-pressed="true"] {
      background: var(--fill-2);
      border-color: var(--accent);
    }

    .hotbar {
      position: absolute;
      top: 74px;
      left: var(--pad);
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      width: 156px;
      pointer-events: none;

    .hotbar > * { pointer-events: auto; }
    .hotbar-tab {
      min-height: 36px;

      border: 1px solid var(--accent-line);
      box-shadow: var(--shadow);
      color: var(--accent);

      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 10px;
    }

      width: 14px; height: 14px;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .hotbar-body {
      background: var(--fill);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 4px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 4px;

    .hotbar-grid {
      display: grid;
      grid-template-columns: repeat(3, var(--tap-sm));
      grid-template-rows: repeat(3, var(--tap-sm));
      gap: 4px;
    }
    .slot {
      width: var(--tap-sm);
      height: var(--tap-sm);
      border-radius: 10px;
      background: var(--chip);
      border: 1px solid var(--accent-line);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      position: relative;
      padding: 2px 0 0;
    }
    .slot svg {
      width: 18px; height: 18px;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .slot .num {
      position: absolute;
      top: 2px; left: 4px;
      font-size: 9px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .slot.empty { border-style: dashed; color: var(--dim); }
    .slot.empty svg { display: none; }
    .slot.armed {
      border-color: var(--accent);
      background: var(--fill-2);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .slot.flash {
      animation: slotflash 0.18s ease;
    }
    .slot.shake {
      animation: slotshake 0.22s ease;
    }
    @keyframes slotflash {
      0% { background: var(--accent); color: var(--on); border-color: var(--accent); }
      100% { background: var(--chip); }
    }
    @keyframes slotshake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }
    .hotbar-edit {
      min-height: 36px;
      border-radius: 10px;
      background: var(--chip);
      border: 1px solid var(--accent-line);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }
    .hotbar-edit[aria-pressed="true"] {
      background: var(--fill-2);
      border-color: var(--accent);
      color: var(--accent);
    }
    .hotbar[data-edit="true"] .hotbar-body {
      border-color: var(--accent);
    }

    .ping {
      position: absolute;
      width: 28px; height: 28px;
      margin: -14px 0 0 -14px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
      pointer-events: none;
      z-index: 9;
      opacity: 0;
    }
    .ping.go { animation: ping 0.32s ease-out; }
    @keyframes ping {
      0% { opacity: 1; transform: scale(0.55); }
      100% { opacity: 0; transform: scale(1.6); }
    }

    .help-back {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(20,17,14,.62);
      z-index: 15;
    }
    .help-back.open { display: block; }
    .help {
      display: none;
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      max-height: calc(100% - 24px);
      overflow: auto;
      z-index: 16;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 12px 12px 14px;
    }
    .help.open { display: block; }
    .help h2 {
      margin: 0 8px 8px 0;
      font-family: Palatino, Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
    }
    .help-x {
      position: absolute;
      top: 8px; right: 8px;
      width: var(--tap-sm); height: var(--tap-sm);
      border-radius: 10px;
      background: var(--chip);
      border: 1px solid var(--accent-line);
      color: var(--ink);
      font-size: 18px;
    }
    .help-rows { display: flex; flex-direction: column; gap: 4px; }
    .help-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .help-row .keys { display: flex; gap: 4px; flex: 0 0 auto; min-width: 52px; }
    .kcap {
      min-width: 26px;
      height: 26px;
      padding: 0 6px;
      border: 1px solid var(--accent-line);
      border-radius: 6px;
      background: var(--chip);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .help-row .ic {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      color: var(--ink);
      flex: 0 0 28px;
    }
    .help-row .ic svg {
      width: 18px; height: 18px;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .help-row .lab {
      font-size: 13px;
      color: var(--ink);
      min-width: 0;
    }
    .help-note {
      margin: 10px 6px 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }
    .help-note b { color: var(--ink); font-weight: 650; }

    @media (orientation: landscape) {
      .hotbar { top: 70px; }
      .help {
        left: 50%;
        right: auto;
        width: min(420px, calc(100% - 160px));
        transform: translate(-50%, -50%);
      }
    }
</style>
</head>
<body>
  <div class="app" data-view="globe" data-tool="move" data-zoom="0" id="app">
    <div class="stage" id="stage" aria-label="Sample map. Left click or drag uses the current tool. Right-drag pans. Wheel or pinch past the edge snaps views. Back goes out.">
      <div class="world" aria-hidden="true">
        <div class="orb-wrap">
          <div class="orb" id="orb"></div>
          <div class="watermark">
            <span class="tag">Sample</span>
            <span class="who" id="sample-label">Sample globe</span>
          </div>
        </div>
      </div>
      <div class="marks" id="marks" aria-hidden="true"></div>
    </div>

    <div class="history" role="group" aria-label="Back, Undo, Redo">
      <button type="button" class="big" id="btn-back" aria-disabled="true" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M10 6 4 12l6 6M4 12h16"/></svg>
        <span>Back</span>
      </button>
      <button type="button" class="big" id="btn-undo" aria-disabled="true" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 8H5V4"/><path d="M5 8a8 8 0 1 1 2.2 6"/></svg>
        <span>Undo</span>
      </button>
      <button type="button" class="big" id="btn-redo" aria-disabled="true" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="M15 8h4V4"/><path d="M19 8a8 8 0 1 0-2.2 6"/></svg>
        <span>Redo</span>
      </button>
    </div>

    <div class="youare" id="youare" data-view="globe" aria-label="You are in Globe">
      <div class="ya-stack" aria-hidden="true">
        <div class="ya-globe"></div>
        <div class="ya-country"></div>
        <div class="ya-metro"></div>
      </div>
      <div class="ya-meta">
        <strong id="view-name">Globe</strong>
        <em id="zoom-label">in 0 / 8</em>
      </div>
    </div>

    <div class="tools" id="tools" role="toolbar" aria-label="Tools">
      <button type="button" class="tool" id="tool-move" data-tool="move" aria-pressed="true" aria-label="Move">
        <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/><path d="M12 4 9 7M12 4l3 3M12 20l-3-3M12 20l3-3M4 12l3-3M4 12l3 3M20 12l-3-3M20 12l-3 3"/></svg>
        <span>Move</span>
      </button>
      <button type="button" class="tool" id="tool-elevate" data-tool="elevate" aria-pressed="false" aria-label="Raise or lower">
        <span class="mini" aria-hidden="true"><i class="on" id="mini-up">▲</i><i id="mini-down">▼</i></span>
        <svg viewBox="0 0 24 24" id="elevate-icon"><path d="M12 19V6"/><path d="m7 11 5-5 5 5"/></svg>
        <span id="elevate-label">Raise</span>
      </button>
      <button type="button" class="tool" id="tool-paint" data-tool="paint" aria-pressed="false" aria-label="Paint">
        <svg viewBox="0 0 24 24"><path d="M14.5 5.5 18 9l-8.5 8.5H6v-3.5L14.5 5.5Z"/><path d="M12.5 7.5 16 11"/></svg>
        <span>Paint</span>
      </button>
      <button type="button" class="tool" id="tool-brush" data-tool="brush" aria-pressed="false" aria-label="Brush">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span id="brush-chip">10 km</span>
      </button>
      <button type="button" class="tool" id="tool-more" data-tool="more" aria-pressed="false" aria-label="More">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
        <span>More</span>
      </button>
    </div>

    <div class="flyout" id="flyout" role="dialog" aria-label="Tool settings"></div>

    <div class="dock">
      <button type="button" class="play" id="play" aria-pressed="false" aria-label="Play sim">
        <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5.5v13L19 12 8 5.5Z"/></svg>
      </button>
      <div class="timeline-wrap" aria-label="Timeline">
        <div class="tl-meta">
          <span>Then</span>
          <span class="tl-year" id="tl-year">800</span>
          <span>Now</span>
        </div>
        <div class="track" id="timeline" role="slider" aria-valuemin="-4000" aria-valuemax="2026" aria-valuenow="800" aria-label="Timeline year">
          <div class="rail"></div>
          <div class="tl-fill" id="tl-fill"></div>
          <div class="ticks" id="tl-ticks"></div>
          <div class="head" id="tl-head"></div>
        </div>
      </div>
      <button type="button" class="sea-chip" id="sea-chip" aria-pressed="false" aria-label="Sea level">
        <svg viewBox="0 0 24 24"><path d="M3 14c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/></svg>
        <span class="val" id="sea-val">0 m</span>
      </button>
    </div>

    <div class="sea-fly" id="sea-fly" aria-label="Sea level slider">
      <span>Sea</span>
      <input id="sea" type="range" min="-11000" max="9000" step="10" value="0" aria-label="Sea level in metres">
      <span class="val" id="sea-fly-val">0 m</span>
    </div>

    <div class="sheet-back" id="sheet-back"></div>
    <div class="sheet" id="sheet" role="dialog" aria-label="More">
      <h3>Draw</h3>
      <div class="grid">
        <button type="button" class="tool" data-more="river"><svg viewBox="0 0 24 24"><path d="M4 18c3-6 5 1 8-4s5-6 8-5"/></svg><span>River</span></button>
        <button type="button" class="tool" data-more="road"><svg viewBox="0 0 24 24"><path d="M8 3 5 21M16 3l3 18M3 9h18M4 15h16"/></svg><span>Road</span></button>
        <button type="button" class="tool" data-more="border"><svg viewBox="0 0 24 24"><path d="M6 4v16M6 4h12M6 20h12"/><path d="M12 4v16" stroke-dasharray="2 3"/></svg><span>Border</span></button>
        <button type="button" class="tool" data-more="soften"><svg viewBox="0 0 24 24"><path d="M4 16c3-4 5 2 8-2s5-5 8-3"/><path d="M4 20c3-4 5 2 8-2s5-5 8-3"/></svg><span>Soften</span></button>
        <button type="button" class="tool" data-more="stamp"><svg viewBox="0 0 24 24"><path d="m12 4 7 16H5L12 4Z"/></svg><span>Stamp</span></button>
      </div>
      <h3>Place</h3>
      <div class="grid">
        <button type="button" class="tool" data-more="label"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7v11M15 7v11M7 18h4M13 18h4"/></svg><span>Label</span></button>
        <button type="button" class="tool" data-more="lake"><svg viewBox="0 0 24 24"><path d="M12 4c3 4 6 7 6 10a6 6 0 0 1-12 0c0-3 3-6 6-10Z"/></svg><span>Lake</span></button>
        <button type="button" class="tool" data-more="erase"><svg viewBox="0 0 24 24"><path d="m6 15 7-7 5 5-5 5H8l-2-3Z"/><path d="M4 20h16"/></svg><span>Erase</span></button>
      </div>
      <h3>Look</h3>
      <div class="grid" id="looks">
        <button type="button" class="tool" data-look="tolkien" aria-pressed="true"><span>RPG</span></button>
        <button type="button" class="tool" data-look="smooth" aria-pressed="false"><span>Smooth</span></button>
        <button type="button" class="tool" data-look="pixel" aria-pressed="false"><span>Pixel</span></button>
        <button type="button" class="tool" data-look="paint" aria-pressed="false"><span>Paint</span></button>
      </div>
      <h3>Go</h3>
      <div class="grid">
        <button type="button" class="tool" data-act="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Fit</span></button>
        <button type="button" class="tool" data-act="cook"><svg viewBox="0 0 24 24"><path d="M12 21s7-4.4 7-10a7 7 0 1 0-14 0c0 5.6 7 10 7 10Z"/><circle cx="12" cy="11" r="2.2"/></svg><span>Inlet</span></button>
        <button type="button" class="tool" data-act="clear"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M8 7l1 12h6l1-12"/></svg><span>Clear</span></button>
      </div>
      <h3>Layers</h3>
      <div class="layers" id="layers"></div>
    </div>


    <button type="button" class="help-btn" id="btn-help" aria-pressed="false" aria-label="Hotkey list">?</button>

    <div class="hotbar" id="hotbar" data-collapsed="false" data-edit="false">
      <button type="button" class="hotbar-tab" id="hotbar-toggle" aria-expanded="true" aria-label="Hide hotbar">
        <span>1–9</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="hotbar-body">
        <div class="hotbar-grid" id="hotbar-grid" role="toolbar" aria-label="Hotbar"></div>
        <button type="button" class="hotbar-edit" id="hotbar-edit" aria-pressed="false">Edit binds</button>
      </div>
    </div>

    <div class="ping" id="ping" aria-hidden="true"></div>
    <div class="help-back" id="help-back"></div>
    <div class="help" id="help" role="dialog" aria-label="Hotkeys">
      <button type="button" class="help-x" id="help-close" aria-label="Close">×</button>
      <h2>Hotkeys</h2>
      <div class="help-rows" id="help-rows"></div>
      <p class="help-note"><b>Hotkeys act at the pointer.</b> On a phone, tap the hotbar.</p>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
  (function () {
    var VIEWS = ['globe', 'country', 'metro'];
    var VIEW_LABEL = { globe: 'Globe', country: 'Country', metro: 'Metro' };
    var SAMPLE = { globe: 'Sample globe', country: 'Sample country', metro: 'Sample metro' };
    var ZOOM_MAX = 8;
    var YMIN = -4000;
    var YMAX = 2026;
    var PAINTS = ['#6f8f45', '#2c5a38', '#d7b483', '#8a8178', '#3e738c'];

    var app = document.getElementById('app');
    var stage = document.getElementById('stage');
    var orb = document.getElementById('orb');
    var marksEl = document.getElementById('marks');
    var youare = document.getElementById('youare');
    var viewName = document.getElementById('view-name');
    var zoomLabel = document.getElementById('zoom-label');
    var sampleLabel = document.getElementById('sample-label');
    var flyout = document.getElementById('flyout');
    var toastEl = document.getElementById('toast');
    var btnBack = document.getElementById('btn-back');
    var btnUndo = document.getElementById('btn-undo');
    var btnRedo = document.getElementById('btn-redo');
    var yearEl = document.getElementById('tl-year');
    var fill = document.getElementById('tl-fill');
    var head = document.getElementById('tl-head');
    var track = document.getElementById('timeline');
    var ticks = document.getElementById('tl-ticks');
    var play = document.getElementById('play');
    var playIcon = document.getElementById('play-icon');
    var sea = document.getElementById('sea');
    var seaVal = document.getElementById('sea-val');
    var seaFlyVal = document.getElementById('sea-fly-val');
    var seaChip = document.getElementById('sea-chip');
    var seaFly = document.getElementById('sea-fly');
    var sheet = document.getElementById('sheet');
    var sheetBack = document.getElementById('sheet-back');
    var toastTimer = null;

    var state = {
      view: 'globe',
      zoom: 0,
      tool: 'move',
      flyout: null,
      raiseMode: 'raise',
      brush: 10,
      paint: PAINTS[0],
      sea: 0,
      year: 800,
      panX: 0,
      panY: 0,
      marks: [],
      playing: false
    };
    var undoStack = [];
    var redoStack = [];
    var playTimer = null;
    var seaBefore = 0;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 900);
    }

    function setDisabled(btn, on) {
      btn.setAttribute('aria-disabled', on ? 'true' : 'false');
      if (on) btn.setAttribute('disabled', '');
      else btn.removeAttribute('disabled');
    }

    function zoomScale() {
      return 1 + state.zoom * 0.06;
    }

    function renderOrb() {
      orb.style.setProperty('--z', String(zoomScale()));
      orb.style.setProperty('--pan-x', state.panX + 'px');
      orb.style.setProperty('--pan-y', state.panY + 'px');
    }

    function renderMarks() {
      var html = '';
      for (var i = 0; i < state.marks.length; i++) {
        var m = state.marks[i];
        var s = 16 + m.size * 1.4;
        var glyph = m.kind === 'raise' ? '▲' : m.kind === 'lower' ? '▼' : '';
        html += '<div class="mark ' + m.kind + '" style="left:' + m.x + '%;top:' + m.y + '%;--s:' + s + 'px;--c:' + m.color + '">' + glyph + '</div>';
      }
      marksEl.innerHTML = html;
    }

    function renderChrome() {
      app.setAttribute('data-view', state.view);
      app.setAttribute('data-tool', state.tool);
      app.setAttribute('data-zoom', String(state.zoom));
      app.setAttribute('data-history', String(undoStack.length));
      app.setAttribute('data-flyout', state.flyout || '');
      youare.setAttribute('data-view', state.view);
      youare.setAttribute('aria-label', 'You are in ' + VIEW_LABEL[state.view]);
      viewName.textContent = VIEW_LABEL[state.view];
      zoomLabel.textContent = 'in ' + state.zoom + ' / ' + ZOOM_MAX;
      sampleLabel.textContent = SAMPLE[state.view];
      setDisabled(btnBack, state.view === 'globe');
      setDisabled(btnUndo, undoStack.length === 0);
      setDisabled(btnRedo, redoStack.length === 0);
      document.querySelectorAll('#tools [data-tool]').forEach(function (b) {
        var id = b.getAttribute('data-tool');
        b.setAttribute('aria-pressed', id === state.tool ? 'true' : 'false');
      });
      document.getElementById('mini-up').classList.toggle('on', state.raiseMode === 'raise');
      document.getElementById('mini-down').classList.toggle('on', state.raiseMode === 'lower');
      document.getElementById('elevate-label').textContent = state.raiseMode === 'raise' ? 'Raise' : 'Lower';
      document.getElementById('elevate-icon').innerHTML = state.raiseMode === 'raise'
        ? '<path d="M12 19V6"/><path d="m7 11 5-5 5 5"/>'
        : '<path d="M12 5v13"/><path d="m7 13 5 5 5-5"/>';
      document.getElementById('brush-chip').textContent = state.brush + ' km';
      sea.value = String(state.sea);
      seaVal.textContent = state.sea + ' m';
      seaFlyVal.textContent = state.sea + ' m';
      stage.classList.toggle('painting', state.tool === 'elevate' || state.tool === 'paint' || state.tool === 'brush');
      renderOrb();
      renderMarks();
    }

    function closeFlyout() {
      state.flyout = null;
      flyout.classList.remove('open');
      flyout.innerHTML = '';
      app.setAttribute('data-flyout', '');
    }

    function positionFlyout(toolId) {
      var btn = document.getElementById('tool-' + toolId);
      if (!btn) return;
      var r = btn.getBoundingClientRect();
      var h = flyout.offsetHeight;
      var top = r.top + (r.height - h) / 2;
      top = Math.max(8, Math.min(top, window.innerHeight - h - 80));
      flyout.style.top = top + 'px';
      flyout.style.right = (window.innerWidth - r.left + 8) + 'px';
    }

    function openFlyout(toolId) {
      if (toolId === 'more') {
        closeFlyout();
        return;
      }
      var html = '';
      if (toolId === 'move') {
        html = '<h4>Move</h4><div class="seg"><button type="button" data-act="zoom-in">In</button><button type="button" data-act="zoom-out">Out</button></div><p class="hint">Left-drag uses the tool. Right-drag pans. Wheel or pinch past the edge snaps the view. Back goes out.</p>';
      } else if (toolId === 'elevate') {
        html = '<h4>Land</h4><div class="seg"><button type="button" data-raise="raise" aria-pressed="' + (state.raiseMode === 'raise' ? 'true' : 'false') + '">Raise</button><button type="button" data-raise="lower" aria-pressed="' + (state.raiseMode === 'lower' ? 'true' : 'false') + '">Lower</button></div><p class="hint">Tap the sample map. Brush ' + state.brush + ' km.</p>';
      } else if (toolId === 'paint') {

    if(flags.tap){
      boxesOf('button,a,input,select,textarea,[role="button"]',
        function(b){return b.w>0&&b.h>0&&Math.min(b.w,b.h)<44;},
        function(d){d.style.outline='2px dashed #f97316';d.style.outlineOffset='1px';});
    }
    if(flags.overflow){
      boxesOf('p,span,strong,label,li,h1,h2,h3,h4,td,th,button,a',
        function(b,el){return el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1;},
        function(d,rec){d.style.width=Math.max(rec.w,4)+'px';d.style.height=Math.max(rec.h,4)+'px';d.style.outline='2px solid #ef4444';d.style.background='rgba(239,68,68,0.12)';});
    }
    if(flags.size){
      var s=document.createElement('div');
      s.style.cssText='position:absolute;left:8px;top:8px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;font-family:'+cssVar('--theme-font-family','system-ui,sans-serif');
      s.textContent=Math.round(w)+'\u00d7'+Math.round(h)+' \u00b7 '+(land?'landscape':'portrait');
      overlays.appendChild(s);
    }
    if(flags.stamp){
      var st=document.createElement('div');
      st.style.cssText='position:absolute;right:8px;bottom:8px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;font-family:'+cssVar('--theme-font-family','system-ui,sans-serif');
      st.textContent='App Mockup \u00b7 '+MOCK_BAR_VERSION+' \u00b7 '+MOCK_BAR_DATE;
      overlays.appendChild(st);
    }
  }

  function startOverlayLoop(){
    stopOverlayLoop();
    paintOverlays();
    overlayTimer=window.setInterval(paintOverlays,500);
    window.addEventListener('resize',paintOverlays);
    if(window.visualViewport)window.visualViewport.addEventListener('resize',paintOverlays);
  }
  function stopOverlayLoop(){
    if(overlayTimer){window.clearInterval(overlayTimer);overlayTimer=0;}
    window.removeEventListener('resize',paintOverlays);
    if(window.visualViewport)window.visualViewport.removeEventListener('resize',paintOverlays);
    overlays.innerHTML='';
  }

  function openHl(){
    frozen='';
    strokes=[];
    hlColor=0;
    devOpen=false;
    live=null;
    hlOpen=true;
    setLayerArmed();
    paintLayer();
    startOverlayLoop();
    renderBar();
  }
  function closeHl(){
    hlOpen=false;
    frozen=null;
    strokes=[];
    devOpen=false;
    hlColor=0;
    live=null;
    setLayerArmed();
    paintLayer();
    stopOverlayLoop();
    renderBar();
  }
  function toggleSwatch(i){
    hlColor=(hlColor===i)?null:i;
    if(!drawArmed()&&live){live=null;}
    setLayerArmed();
    paintLayer();
    renderBar();
  }
  function undoStroke(){strokes=strokes.slice(0,-1);paintLayer();}
  function clearStrokes(){strokes=[];paintLayer();}

  function gripEl(){
    var g=document.createElement('button');
    g.type='button';
    g.className='mockbar-v23-grip';
    g.setAttribute('aria-label','Drag to move Mock bar');
    g.title='Drag';
    var ns='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(ns,'svg');
    svg.setAttribute('aria-hidden','true');
    svg.setAttribute('focusable','false');
    svg.setAttribute('width','18');
    svg.setAttribute('height','12');
    svg.setAttribute('viewBox','0 0 18 12');
    svg.setAttribute('fill','currentColor');
    var dots=[[3,2],[9,2],[15,2],[3,10],[9,10],[15,10]];
    dots.forEach(function(p){
      var c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',String(p[0]));
      c.setAttribute('cy',String(p[1]));
      c.setAttribute('r','1.6');
      svg.appendChild(c);
    });
    g.appendChild(svg);
    bindDrag(g,false);
    return g;
  }

  function renderBar(){
    bar.innerHTML='';
    if(!hlOpen){
      var open=chip({label:'Open Mock highlighter',title:'Mock',weight:'600'});
      open.appendChild(iconSvg('pen'));
      var lab=document.createElement('span');
      lab.style.marginLeft='2px';lab.style.opacity='1';
      lab.textContent='Mock';
      open.appendChild(lab);
      bindDrag(open,true);
      bar.appendChild(open);
      applyPlace();
      return;
    }
    bar.appendChild(gripEl());
    bar.appendChild(chip({
      label:'Done — close highlighter and restore controls',
      title:'Done',weight:'600',describedBy:'mockbar-v23-sr',onClick:closeHl,el:iconSvg('done')
    }));
    HL.forEach(function(h,i){
      var sel=hlColor===i;
      var dot=document.createElement('span');
      dot.className='mockbar-v23-dot';
      dot.setAttribute('aria-hidden','true');
      dot.style.background=h[1];
      var c=chip({
        label:sel? h[0]+', selected — tap to deselect' : h[0]+', tap to select',
        title:sel? h[0]+' (selected — tap to deselect)' : h[0],
        pressed:sel,
        weight:sel?'700':'400',
        border:sel?('2px solid '+themeText()):('1px dashed '+themeBorder()),
        outline:sel?('2px solid '+h[1]):undefined,
        onClick:function(){toggleSwatch(i);},
        el:dot
      });
      bar.appendChild(c);
    });
    bar.appendChild(chip({label:'Undo last mark',title:'Undo',onClick:undoStroke,el:iconSvg('undo')}));
    bar.appendChild(chip({label:'Clear all marks',title:'Clear',onClick:clearStrokes,el:iconSvg('clear')}));
    bar.appendChild(chip({
      label:'Dev overlays',title:'Dev',expanded:devOpen,pressed:devOpen,
      weight:devOpen?'700':'400',
      border:devOpen?('2px solid '+themeText()):('1px solid '+themeBorder()),
      onClick:function(){devOpen=!devOpen;renderBar();},
      el:iconSvg('dev')
    }));
    if(devOpen){
      var grp=document.createElement('span');
      grp.className='mockbar-v23-dev';
      grp.setAttribute('role','group');
      grp.setAttribute('aria-label','Dev overlay toggles');
      function devChip(key,title,text){
        var on=dev[key];
        return chip({
          title:title,pressed:on,text:text,
          weight:on?'700':'400',
          border:on?('2px solid '+themeText()):('1px solid '+themeBorder()),
          onClick:function(){dev[key]=!dev[key];paintOverlays();renderBar();}
        });
      }
      grp.appendChild(devChip('boxes','Show boxes','Boxes'));
      grp.appendChild(devChip('grid','Layout grid','Grid'));
      grp.appendChild(devChip('size','Screen size','Size'));
      grp.appendChild(devChip('tap','Tap targets under 44px','Tap'));
      grp.appendChild(devChip('overflow','Text overflow','Overflow'));
      grp.appendChild(devChip('stamp','Version stamp','Stamp'));
      bar.appendChild(grp);
    }
    var st=document.createElement('span');
    st.className='mockbar-v23-status';
    st.setAttribute('role','status');
    st.textContent=drawArmed()?('Drawing: '+HL[hlColor][0]):'No color — page free to scroll/tap';
    bar.appendChild(st);
    var sr=document.createElement('span');
    sr.id='mockbar-v23-sr';
    sr.className='';
    sr.style.cssText='position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);border:0';
    sr.textContent=(frozen?'View frozen. ':'Snapshot unavailable; live view shown, gestures blocked. ')+(drawArmed()?'Drawing armed. ':'No swatch selected; overlay ignores pointers. ')+'Tap selected swatch to deselect. Screenshot to capture marks.';
    bar.appendChild(sr);
    applyPlace();
  }

  var ro=typeof ResizeObserver!=='undefined'?new ResizeObserver(function(){if(hlOpen)paintLayer();}):null;
  if(ro)ro.observe(layer);
  pos=readStoredPos();
  renderBar();
})();
</script>

</body>
</html>
