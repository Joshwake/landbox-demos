<!-- Landbox map maker standalone v1. Offline single file. Original procedural art. No network. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'">
<title>Landbox map maker</title>
<style>
  :root {
    --bg: #14110e;
    --surface: #221c16;
    --ink: #f3eadb;
    --muted: #b3a48e;
    --line: #3c3228;
    --accent: #e0b15a;
    --chip: #2a241c;
    --mock-rest: rgba(42, 36, 28, 0.3);
    --mock-solid: #2a241c;
    --tap: 44px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button {
    min-height: var(--tap); min-width: var(--tap);
    background: var(--chip); border: 1px solid #4a3d30; border-radius: 10px;
    padding: 6px 10px; cursor: pointer;
  }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button[aria-pressed="true"] { border-color: var(--accent); background: #3a3124; }
  #app {
    height: 100%; height: 100dvh; display: flex; flex-direction: column;
    padding-bottom: 86px; overflow: hidden;
  }
  #workspace, #side { display: contents; }
  #header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 6px 10px 2px; background: #1a1612; order: 1;
  }
  .brand {
    font-family: Palatino, Georgia, "Times New Roman", serif;
    font-size: 20px; line-height: 1; padding: 8px 0;
  }
  .seedlab { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #seed, #sea-num, #label-text {
    min-height: var(--tap); background: #14110e; border: 1px solid #4a3d30;
    border-radius: 8px; padding: 4px 8px; max-width: 100%;
  }
  #seed { width: 92px; }
  #back {
    margin-left: auto; min-height: var(--tap); display: inline-flex; align-items: center;
    padding: 0 8px; color: var(--accent); text-decoration: none; font-weight: 600;
  }
  #hint, #geo {
    flex-basis: 100%; margin: 0; color: var(--muted); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #geo { color: #d7c4a3; }
  #stage { order: 2; flex: 1 1 auto; min-height: 80px; position: relative; background: #16323f; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #context {
    order: 3; display: flex; gap: 6px; align-items: center; overflow-x: auto;
    padding: 6px 8px; min-height: 56px; background: #1c1814; border-top: 1px solid var(--line);
  }
  #hotbar {
    order: 4; display: flex; flex-wrap: wrap; gap: 3px; overflow-x: auto; padding: 4px 6px;
    background: #1a1612; border-top: 1px solid var(--line); max-width: 100%;
  }
  .slot {
    flex: 0 0 44px; width: 44px; min-width: 44px; height: 48px; padding: 2px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .slot .k { font-size: 11px; color: var(--accent); line-height: 1; font-weight: 700; }
  .slot .a { font-size: 8px; line-height: 1.05; max-width: 42px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  #dock { order: 5; background: #1a1612; border-top: 1px solid var(--line); padding: 6px 8px 8px; }
  .dock-btns, #context { max-width: 100%; }
  .dock-btns { display: flex; gap: 6px; overflow-x: auto; }
  .dock-sea { display: flex; align-items: center; gap: 8px; min-height: var(--tap); }
  .dock-sea label { color: var(--muted); min-width: 28px; }
  #sea { flex: 1; min-height: var(--tap); accent-color: var(--accent); }
  #sea-num { width: 76px; }
  .swatch, .stamp-btn, .style-btn, .ink-btn, .sculpt-btn {
    flex: 0 0 auto; width: var(--tap); height: var(--tap); padding: 3px; border-radius: 10px;
  }
  .swatch { border: 2px solid #1a1612; }
  .swatch[aria-pressed="true"], .stamp-btn[aria-pressed="true"], .style-btn[aria-pressed="true"], .ink-btn[aria-pressed="true"], .sculpt-btn[aria-pressed="true"] {
    border-color: var(--accent);
  }
  .stamp-btn canvas { width: 32px; height: 32px; display: block; margin: 0 auto; }
  .field { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .field input[type="range"] { width: 110px; min-height: var(--tap); accent-color: var(--accent); }
  #label-text { width: 140px; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 86px; z-index: 30;
    max-height: min(72dvh, 560px); background: var(--surface);
    border-top: 1px solid #4a3d30; border-radius: 16px 16px 0 0;
    display: flex; flex-direction: column; padding: 8px 10px 12px;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.35);
  }
  #sheet[hidden] { display: none; }
  #sheet header { display: flex; align-items: center; gap: 8px; }
  #sheet h2 { font-size: 16px; margin: 0; font-family: Palatino, Georgia, serif; flex: 1; }
  #sheet .body { overflow: auto; padding-top: 4px; }
  .toggle {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    text-align: left; margin: 4px 0; min-height: 48px; gap: 10px;
  }
  .toggle b { display: block; font-weight: 650; }
  .toggle small { display: block; color: var(--muted); font-size: 12px; }
  .knob {
    width: 42px; height: 26px; border-radius: 99px; background: #3a322a;
    border: 1px solid #6a5a48; position: relative; flex: none;
  }
  .toggle[aria-checked="true"] .knob { background: var(--accent); border-color: #f0d7a0; }
  .knob::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #f3eadb;
  }
  .toggle[aria-checked="true"] .knob::after { left: 19px; }
  .assign {
    width: 100%; text-align: left; margin: 3px 0; min-height: var(--tap);
  }
  .assign[aria-pressed="true"] { border-color: var(--accent); }
  #toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    background: #3a3124; color: var(--ink); border: 1px solid var(--accent);
    border-radius: 999px; padding: 8px 14px; z-index: 40; max-width: calc(100% - 24px);
  }
  #toast[hidden] { display: none; }
  #boot-error {
    position: fixed; inset: 12px auto auto 12px; right: 12px; z-index: 50;
    background: #3a1814; color: #ffd8d0; border: 1px solid #c4543a; border-radius: 10px; padding: 10px;
  }
  #boot-error[hidden] { display: none; }
  /* Mock bar v2.2 — background alpha only; icons, label, and swatch dots stay opaque. */
  #mock-bar {
    position: fixed; left: 8px; bottom: 8px; z-index: 80;
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    max-width: calc(100vw - 16px);
  }
  .mock-version {
    margin: 0; font-size: 11px; line-height: 1.2; color: #f3eadb; opacity: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,.65);
  }
  .mock-row { display: flex; gap: 4px; align-items: center; position: relative; }
  .mock-chip, .mock-swatch {
    opacity: 1; color: #f3eadb; background: var(--mock-rest);
    border: 1px solid rgba(243, 234, 219, 0.55); border-radius: 10px;
    min-height: var(--tap); min-width: var(--tap); padding: 0 10px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .mock-chip:hover, .mock-chip:focus, .mock-chip:active,
  .mock-swatch:hover, .mock-swatch:focus, .mock-swatch:active,
  .mock-chip[aria-pressed="true"], .mock-swatch[aria-pressed="true"],
  .mock-chip[aria-expanded="true"] { background: var(--mock-solid); }
  .mock-swatch i { width: 16px; height: 16px; border-radius: 50%; display: block; opacity: 1; }
  .mock-swatch[data-color="y"] i { background: #e2b100; }
  .mock-swatch[data-color="g"] i { background: #2f9e44; }
  .mock-swatch[data-color="r"] i { background: #e03131; }
  #mock-dev-panel {
    position: absolute; bottom: calc(100% + 4px); left: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  #mock-dev-panel[hidden] { display: none; }
  #mark-layer { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
  #mark-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mark-num {
    position: absolute; transform: translate(-50%, -50%);
    min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
    background: #14110e; color: #f3eadb; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; opacity: 1;
    border: 1px solid currentColor; pointer-events: none;
  }
  #mark-layer.numbers-off .mark-num { visibility: hidden; }
  #mark-layer.marks-off #mark-canvas, #mark-layer.marks-off .mark-num { visibility: hidden; }
  body.mock-guides button, body.mock-guides a, body.mock-guides input, body.mock-guides .slot {
    outline: 1px dashed #e0b15a !important; outline-offset: 1px;
  }
  @media (min-width: 900px) {
    .slot { flex-basis: 72px; width: 72px; height: 52px; }
    .slot .a { font-size: 11px; max-width: 68px; }
    #hotbar { gap: 6px; padding: 6px 8px; }
  }
  @media (orientation: landscape) and (max-height: 560px) {
    #app { padding-bottom: 64px; }
    #workspace { display: flex; order: 2; flex: 1 1 auto; width: 100%; min-height: 0; }
    #side { display: flex; flex-direction: column; width: min(42vw, 240px); min-height: 0; overflow: auto; }
    #stage { flex: 1 1 auto; min-width: 0; order: 0; }
    #context, #dock { order: 0; }
    #header, #hotbar { width: 100%; }
    #sheet { bottom: 64px; }
    .brand { font-size: 16px; padding: 4px 0; }
  }
</style>
</head>
<body>
<main id="app">
  <header id="header">
    <div class="brand">Landbox</div>
    <label class="seedlab">Seed <input id="seed" inputmode="numeric" autocomplete="off" aria-label="Map seed" value="20261110"></label>
    <a id="back" href="landbox-mapmaker-globe-v1.html">Back to globe</a>
    <p id="geo" hidden></p>
    <p id="hint">Paint terrain. Right-click raises land. Shift, Ctrl, or Alt with right-click lowers it.</p>
  </header>
  <div id="workspace">
    <div id="stage"><canvas id="view" aria-label="Fantasy map"></canvas></div>
    <div id="side">
      <div id="context"></div>
      <div id="dock">
        <div class="dock-btns">
          <button type="button" id="regen">New map</button>
          <button type="button" id="features-btn">Features</button>
          <button type="button" id="layers-btn">Layers</button>
          <button type="button" id="undo-btn">Undo</button>
          <button type="button" id="redo-btn">Redo</button>
          <button type="button" id="export-btn">Export</button>
          <button type="button" id="rebind" aria-pressed="false">Rebind</button>
        </div>
        <div class="dock-sea">
          <label for="sea">Sea</label>
          <input id="sea" type="range" min="0.15" max="0.75" step="0.005" value="0.42" aria-valuemin="0.15" aria-valuemax="0.75">
          <input id="sea-num" type="number" min="0.15" max="0.75" step="0.005" value="0.42" aria-label="Sea level value">
        </div>
      </div>
    </div>
  </div>
  <div id="hotbar" aria-label="Hotbar"></div>
</main>
<div id="sheet" hidden>
  <header>
    <h2 id="sheet-title">Features</h2>
    <button type="button" id="sheet-close">Close</button>
  </header>
  <div class="body" id="sheet-body"></div>
</div>
<div id="toast" hidden role="status"></div>
<div id="boot-error" hidden></div>
<div id="mock-bar" role="region" aria-label="Mock bar v2.2" data-version="Mock bar v2.2">
  <p class="mock-version">Mock bar v2.2</p>
  <div class="mock-row">
    <button type="button" class="mock-swatch" data-color="y" aria-label="Yellow mark" aria-pressed="false"><i></i></button>
    <button type="button" class="mock-swatch" data-color="g" aria-label="Green mark" aria-pressed="false"><i></i></button>
    <button type="button" class="mock-swatch" data-color="r" aria-label="Red mark" aria-pressed="false"><i></i></button>
    <button type="button" class="mock-chip" id="mock-numbers" aria-pressed="true" aria-label="Numbering">#</button>
    <button type="button" class="mock-chip" id="mock-dev" aria-expanded="false" aria-label="Dev toggles">Dev</button>
    <div id="mock-dev-panel" hidden>
      <button type="button" class="mock-chip" id="mock-guides" aria-pressed="false">Guides</button>
      <button type="button" class="mock-chip" id="mock-marks" aria-pressed="true">Marks</button>
    </div>
  </div>
</div>
<div id="mark-layer" aria-hidden="true"><canvas id="mark-canvas"></canvas></div>
<script>
(function () {
  'use strict';
  const W = 512, H = 320;
  const TERRAIN = {
    grass:    { name: 'Grass',    color: '#6f8f45' },
    forest:   { name: 'Forest',   color: '#2c5a38' },
    desert:   { name: 'Desert',   color: '#d7b483' },
    snow:     { name: 'Snow',     color: '#e7eef0' },
    swamp:    { name: 'Swamp',    color: '#5a6840' },
    farmland: { name: 'Farmland', color: '#c2b15a' },
    rock:     { name: 'Rock',     color: '#8a8178' },
    water:    { name: 'Water',    color: '#3e738c' }
  };
  const STAMP_TYPES = ['castle', 'town', 'village', 'mountain', 'hill', 'trees', 'tower'];
  const INKS = ['#241910', '#f4efe4', '#8f2d2d', '#1e4d8c', '#1f6b3a'];
  const REGION_COLORS = ['#9c3b3b', '#2f5f8a', '#c4a15a', '#3f6b45', '#6b4c7a'];
  const FEATURE_LIST = [
    { id: 'layers', name: 'Layers', detail: 'Hide terrain, water, stamps, labels, and the rest. Modeled on Inkarnate.' },
    { id: 'scatter', name: 'Symbol scatter brush', detail: 'Drop trees and hills along a stroke. Inkarnate and Wonderdraft.' },
    { id: 'ripples', name: 'Coastline ripple lines', detail: 'Extra waterlines off the shore.' },
    { id: 'frame', name: 'Map frame', detail: 'Double-line border with corner marks.' },
    { id: 'compass', name: 'Compass rose', detail: 'North rose, drawn for this demo.' },
    { id: 'scale', name: 'Scale bar', detail: 'League scale that follows zoom.' },
    { id: 'parchment', name: 'Parchment overlay', detail: 'Warm paper grain over the paint.' },
    { id: 'regions', name: 'Political region coloring', detail: 'Translucent realm colors. Azgaar-style.' },
    { id: 'grid', name: 'Square grid', detail: 'Straight grid. Dungeondraft-style.' },
    { id: 'hex', name: 'Hex overlay', detail: 'Hex grid. Worldographer and Dungeondraft.' },
    { id: 'undo', name: 'Undo / redo', detail: 'Twenty steps. Off until you turn it on.' },
    { id: 'exportPng', name: 'Export PNG', detail: 'Download the map as a PNG.' }
  ];
  const LAYER_LIST = [
    ['terrain', 'Terrain paint'],
    ['hillshade', 'Hillshade'],
    ['water', 'Sea and coast'],
    ['regions', 'Political colors'],
    ['rivers', 'Rivers'],
    ['roads', 'Roads'],
    ['borders', 'Borders'],
    ['stamps', 'Stamps'],
    ['labels', 'Labels'],
    ['overlays', 'Grid, frame, compass, scale, parchment']
  ];
  const ACTIONS = [
    ['paint', 'Paint'], ['stamp', 'Stamp'], ['raise', 'Raise'], ['lower', 'Lower'],
    ['river', 'River'], ['label', 'Label'], ['border', 'Border'], ['road', 'Road'],
    ['region', 'Region'], ['scatter', 'Scatter'], ['pan', 'Pan'],
    ['zoomIn', 'Zoom in'], ['zoomOut', 'Zoom out'],
    ['panLeft', 'Pan west'], ['panRight', 'Pan east'], ['panUp', 'Pan north'], ['panDown', 'Pan south'],
    ['undo', 'Undo'], ['redo', 'Redo'], ['generate', 'New map'], ['export', 'Export'],
    ['rotate', 'Rotate'], ['brushUp', 'Bigger brush'], ['brushDown', 'Smaller brush'],
    ['features', 'Features'], ['seaUp', 'Sea up'], ['seaDown', 'Sea down']
  ];
  const ACTION_NAME = Object.fromEntries(ACTIONS);
  const PAN = { panLeft: [-1, 0], panRight: [1, 0], panUp: [0, -1], panDown: [0, 1] };
  const CONTINUOUS = new Set(['zoomIn', 'zoomOut', 'brushUp', 'brushDown', 'seaUp', 'seaDown', 'panLeft', 'panRight', 'panUp', 'panDown']);
  const HINTS = {
    paint: 'Paint terrain. Right-click raises land. Shift, Ctrl, or Alt with right-click lowers it.',
    stamp: 'Tap to place a stamp. Drag a stamp to move it. Delete removes the selected one.',
    raise: 'Drag to raise land. The Raise / Lower switch is the phone control. Right-click also raises.',
    lower: 'Drag to lower land. Modified right-click lowers too.',
    river: 'Tap to drop points. The line tapers toward the end. Done commits it.',
    label: 'Tap to place a name. Drag a name to move it. Rename it in the field.',
    border: 'Tap points for a border. Solid, dashed, or dotted.',
    road: 'Tap points for a road. Solid, dashed, or dotted.',
    region: 'Paint a realm. Turn on Political region coloring to see it.',
    scatter: 'Drag to drop trees and hills. Turn on Symbol scatter brush first.',
    pan: 'Drag the map. W A S D pan as well.'
  };

  const stage = document.getElementById('stage');
  const view = document.getElementById('view');
  const vctx = view.getContext('2d');
  const contextEl = document.getElementById('context');
  const hotbarEl = document.getElementById('hotbar');
  const sheet = document.getElementById('sheet');
  const sheetTitle = document.getElementById('sheet-title');
  const sheetBody = document.getElementById('sheet-body');
  const seedInput = document.getElementById('seed');
  const seaInput = document.getElementById('sea');
  const seaNum = document.getElementById('sea-num');
  const hintEl = document.getElementById('hint');
  const geoEl = document.getElementById('geo');
  const backLink = document.getElementById('back');

  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }
  const terrainC = makeCanvas(W, H);
  const shadeC = makeCanvas(W, H);
  const waterC = makeCanvas(W, H);
  const regionC = makeCanvas(W, H);
  const paperC = makeCanvas(W, H);
  const tctx = terrainC.getContext('2d', { willReadFrequently: true });
  const sctx = shadeC.getContext('2d', { willReadFrequently: true });
  const wctx = waterC.getContext('2d', { willReadFrequently: true });
  const rctx = regionC.getContext('2d', { willReadFrequently: true });

  let height = new Float32Array(W * H);
  let sea = 0.42;
  let seed = 20261110;
  let lat = null, lon = null;
  let brush = 22;
  let tool = 'paint';
  let terrainName = 'grass';
  let stampType = 'castle';
  let stampRot = 0;
  let ink = INKS[0];
  let sculptMode = 'raise';
  let lineStyle = 'solid';
  let riverW = 8;
  let regionColor = REGION_COLORS[0];
  let scatterKind = 'mixed';
  let rebindMode = false;
  let pendingSlot = null;
  let sheetKind = null;
  const stamps = [];
  const rivers = [];
  const roads = [];
  const borders = [];
  const labels = [];
  let draft = { kind: null, points: [] };
  let selection = null;
  let nextId = 1;
  let coastLines = [];
  let didFit = false;
  let dirty = true;
  let drawCount = 0;
  let genStats = { snow: 0, water: 0, land: 0 };
  const cam = { cx: W / 2, cy: H / 2, zoom: 1 };
  const features = {};
  FEATURE_LIST.forEach(function (f) { features[f.id] = false; });
  const layers = {};
  LAYER_LIST.forEach(function (l) { layers[l[0]] = true; });
  const slots = [
    { key: '1', action: 'paint' }, { key: '2', action: 'stamp' }, { key: '3', action: 'raise' },
    { key: '4', action: 'river' }, { key: '5', action: 'label' }, { key: '6', action: 'border' },
    { key: '7', action: 'road' }, { key: '8', action: 'region' }, { key: '9', action: 'scatter' },
    { key: 'q', action: 'zoomOut' }, { key: 'w', action: 'panUp' }, { key: 'e', action: 'zoomIn' },
    { key: 'a', action: 'panLeft' }, { key: 's', action: 'panDown' }, { key: 'd', action: 'panRight' }
  ];
  const undoStack = [];
  const redoStack = [];
  const held = new Set();
  let lastExport = null;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function uid() { return nextId++; }
  function noteIds() {
    const all = stamps.concat(rivers, roads, borders, labels);
    for (let i = 0; i < all.length; i++) if (all[i].id >= nextId) nextId = all[i].id + 1;
  }
  function hexRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgba(hex, a) {
    const c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function hash2(ix, iy, s) {
    let n = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263) + Math.imul(s | 0, 1442695041);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const xf = x - x0, yf = y - y0;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(x0, y0, s), b = hash2(x0 + 1, y0, s);
    const c = hash2(x0, y0 + 1, s), d = hash2(x0 + 1, y0 + 1, s);
    return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
  }
  function fbm(x, y, s, oct) {
    let a = 0, f = 1, amp = 1, sum = 0;
    for (let i = 0; i < oct; i++) {
      a += amp * vnoise(x * f, y * f, (s + i * 101) | 0);
      sum += amp; amp *= 0.5; f *= 2.03;
    }
    return a / sum;
  }
  function mulberry32(a) {
    let t = a >>> 0;

  function capture() {

  function exportPNG() {
    if (!features.exportPng) { toast('Turn on Export PNG in Features'); return null; }

    c.width = W * scale; c.height = H * scale;
    const ctx = c.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#143240';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(terrainC, 0, 0);
    ctx.drawImage(shadeC, 0, 0);
    ctx.drawImage(waterC, 0, 0);
    if (features.regions && layerOn('regions')) ctx.drawImage(regionC, 0, 0);
    if (features.parchment && layerOn('overlays')) {

    coastLines.forEach(function (line) { strokePoly(ctx, line); });
    if (features.ripples) {

        ctx.globalAlpha = 0.4; strokePoly(ctx, offsetLine(line, 8)); ctx.globalAlpha = 1;

    }
    ctx.restore();

      const poly = taperRibbon(rv.points, rv.w0, rv.w1);
      if (!poly) return;
      ctx.beginPath(); ctx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);

    });

    labels.forEach(function (lab) { drawLabel(ctx, lab); });
    const savedZoom = cam.zoom;
    cam.zoom = 1;
    if (features.grid && layerOn('overlays')) drawGrid(ctx);
    if (features.hex && layerOn('overlays')) drawHex(ctx);
    if (features.frame && layerOn('overlays')) drawFrame(ctx, W, H);
    if (features.compass && layerOn('overlays')) drawCompass(ctx, W, H);
    if (features.scale && layerOn('overlays')) drawScale(ctx, W, H);

  }

  function hitStamp(w) {
    let best = null, bestD = 1e9;
    for (let i = 0; i < stamps.length; i++) {
      const s = stamps[i];
      const d = Math.hypot(s.x - w.x, s.y - w.y);
      const rad = 16 * (s.size || 1);
      if (d < rad && d < bestD) { best = s; bestD = d; }
    }
    return best;
  }
  function hitLabel(w) {
    let best = null, bestD = 1e9;
    for (let i = 0; i < labels.length; i++) {
      const lab = labels[i];
      const d = Math.hypot(lab.x - w.x, lab.y - w.y);
      if (d < Math.max(18, (lab.text || '').length * (lab.size || 14) * 0.28) && d < bestD) { best = lab; bestD = d; }
    }

  }
  function distToPoly(w, points) {
    let best = 1e9;

      const dx = b.x - a.x, dy = b.y - a.y;
      const l2 = dx * dx + dy * dy || 1;
      let t = ((w.x - a.x) * dx + (w.y - a.y) * dy) / l2;
      t = clamp(t, 0, 1);
      best = Math.min(best, Math.hypot(a.x + dx * t - w.x, a.y + dy * t - w.y));
    }
    return best;
  }
  function hitLine(list, w) {

    for (let i = 0; i < list.length; i++) {

      if (d < bestD) { best = list[i]; bestD = d; }
    }
    return best;
  }

  let gesture = null;
  let lastW = { x: 0, y: 0 };
  let downW = { x: 0, y: 0 };
  let moved = false;
  let sculptTimer = 0;
  let coastClock = 0;
  let pendingSnap = false;
  let liveRight = false, liveShift = false, liveCtrl = false, liveAlt = false, liveMeta = false;
  const pointers = new Map();
  let pinch = null;
  let repeatTimer = 0;

  function currentSculptSign() {
    if (liveRight) return (liveShift || liveCtrl || liveAlt || liveMeta) ? -1 : 1;
    if (tool === 'lower' || sculptMode === 'lower') return -1;
    return 1;
  }
  function sculptAt(x, y, sign) {
    const power = 0.16 * sign;
    const rect = forBrush(x, y, brush, function (px, py, fall) {
      const i = py * W + px;
      height[i] = clamp(height[i] + power * fall, 0, 1);
    });
    rebuildShade(rect.x0 - 2, rect.y0 - 2, rect.x1 + 2, rect.y1 + 2);
    rebuildWater(rect.x0 - 2, rect.y0 - 2, rect.x1 + 2, rect.y1 + 2);

  function startScatter(w) {

  let lastScatter = { x: -999, y: -999 };

    const type = kinds[Math.floor(Math.random() * kinds.length)];

      id: uid(), type: type,
      x: x + (Math.random() - 0.5) * brush * 0.8,
      y: y + (Math.random() - 0.5) * brush * 0.8,

    } else if (gesture === 'place-label' && !moved) {

  function commitDraft() {

  function renderLayers() {
    sheetTitle.textContent = 'Layers';
    sheetBody.innerHTML = '<p class="field">Hidden layers stay in the map. Turn Layers off in Features to show everything.</p>' + LAYER_LIST.map(function (l) {
      const on = layers[l[0]] !== false ? 'true' : 'false';
      return '<button type="button" class="toggle" role="switch" data-layer="' + l[0] + '" aria-checked="' + on + '"><span><b>' + l[1] + '</b></span><i class="knob" aria-hidden="true"></i></button>';
    }).join('');
    openSheet('layers');
  }
  function renderPicker() {
    sheetTitle.textContent = pendingSlot ? ('Assign ' + pendingSlot.toUpperCase()) : 'Pick an action';
    const current = pendingSlot ? slots.find(function (s) { return s.key === pendingSlot; }) : null;
    sheetBody.innerHTML = ACTIONS.map(function (a) {
      const on = current && current.action === a[0];
      return '<button type="button" class="assign" data-assign="' + a[0] + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + a[1] + '</button>';
    }).join('') + '<p class="field">Defaults: 1 paint, 2 stamp, 3 raise, 4 river, 5 label, 6 border, 7 road, 8 region, 9 scatter. W A S D pan. Q and E zoom. Bindings reset when you leave this page.</p>';
    openSheet('picker');
  }

  function setTool(name) {
    if (name === 'raise' || name === 'lower') {
      sculptMode = name === 'lower' ? 'lower' : 'raise';
      tool = sculptMode === 'lower' ? 'lower' : 'raise';
    } else tool = name;
    if (draft.kind && draft.kind !== tool) draft = { kind: null, points: [] };
    renderContext();
    renderHotbar();
  }
  function runAction(action) {
    if (action === 'raise' || action === 'lower') { setSculpt(action); return; }
    if (['paint', 'stamp', 'river', 'label', 'border', 'road', 'region', 'scatter', 'pan'].indexOf(action) >= 0) { setTool(action); return; }
    if (action === 'zoomIn') { cam.zoom = clamp(cam.zoom * 1.12, 0.35, 8); dirty = true; return; }
    if (action === 'zoomOut') { cam.zoom = clamp(cam.zoom / 1.12, 0.35, 8); dirty = true; return; }
    if (PAN[action]) { held.add(action); return; }
    if (action === 'undo') { undo(); return; }
    if (action === 'redo') { redo(); return; }
    if (action === 'generate') { doGenerate(); return; }
    if (action === 'export') { exportPNG(); return; }
    if (action === 'rotate') {
      stampRot += Math.PI / 12;
      const obj = selectedObject();
      if (obj && selection.kind === 'stamp') { obj.rot = (obj.rot || 0) + Math.PI / 12; dirty = true; }
      return;
    }
    if (action === 'brushUp') { brush = clamp(brush + 4, 6, 64); renderContext(); return; }
    if (action === 'brushDown') { brush = clamp(brush - 4, 6, 64); renderContext(); return; }
    if (action === 'features') { renderFeatures(); return; }
    if (action === 'seaUp') { setSea(sea + 0.01); return; }
    if (action === 'seaDown') { setSea(sea - 0.01); return; }
  }
  function setSculpt(mode) {
    sculptMode = mode === 'lower' ? 'lower' : 'raise';
    tool = sculptMode === 'lower' ? 'lower' : 'raise';
    renderContext();
    renderHotbar();
  }
  function setSea(v) {
    const n = Number(v);
    if (n !== n) return;
    sea = clamp(n, 0.15, 0.75);
    seaInput.value = String(sea);
    seaNum.value = sea.toFixed(3);
    rebuildWater(0, 0, W, H);
    buildCoast();
    dirty = true;
  }
  function doGenerate() {
    const n = Number(seedInput.value);
    if (seedInput.value.trim() === '' || n !== n) { toast('Type a seed number'); return; }
    takeSnapshot();
    generate(n, lat, lon);
    didFit = false;
    resize();
  }

  function slotByKey(k) { return slots.find(function (s) { return s.key === k; }); }

  contextEl.addEventListener('click', function (e) {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.terrain) { terrainName = t.dataset.terrain; renderContext(); }
    else if (t.dataset.stamp) { stampType = t.dataset.stamp; renderContext(); }
    else if (t.dataset.ink) { ink = t.dataset.ink; const obj = selectedObject(); if (obj && selection.kind === 'stamp') { obj.color = ink; dirty = true; } renderContext(); }
    else if (t.dataset.style) { lineStyle = t.dataset.style; renderContext(); }
    else if (t.dataset.region) { regionColor = t.dataset.region; renderContext(); }
    else if (t.dataset.scatter) { scatterKind = t.dataset.scatter; renderContext(); }
    else if (t.id === 'sculpt-raise') setSculpt('raise');
    else if (t.id === 'sculpt-lower') setSculpt('lower');
    else if (t.id === 'line-done') commitDraft();
    else if (t.id === 'line-back') { draft.points.pop(); if (!draft.points.length) draft.kind = null; renderContext(); dirty = true; }
    else if (t.id === 'entity-delete') deleteSelection();
  });
  contextEl.addEventListener('input', function (e) {
    if (e.target.id === 'brush') brush = Number(e.target.value);
    else if (e.target.id === 'river-w') riverW = Number(e.target.value);
    else if (e.target.id === 'label-text') {
      const lab = selectedObject();
      if (lab && selection.kind === 'label') { lab.text = e.target.value; dirty = true; }
    } else if (e.target.id === 'label-curve') {
      const lab = selectedObject();
      if (lab && selection.kind === 'label') { lab.curve = e.target.checked; dirty = true; }
    }
  });
  contextEl.addEventListener('change', function (e) {
    if (e.target.id === 'label-curve') {
      const lab = selectedObject();
      if (lab) { lab.curve = e.target.checked; dirty = true; }
    }
  });

  hotbarEl.addEventListener('pointerdown', function (e) {
    const btn = e.target.closest('[data-slot]');
    if (!btn) return;
    if (rebindMode) { pendingSlot = btn.dataset.slot; renderPicker(); return; }
    const slot = slotByKey(btn.dataset.slot);
    if (!slot) return;
    if (CONTINUOUS.has(slot.action) || PAN[slot.action]) {
      e.preventDefault();
      startRepeat(slot.action);
    }
  });
  hotbarEl.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-slot]');
    if (!btn || rebindMode) return;
    const slot = slotByKey(btn.dataset.slot);
    if (!slot || CONTINUOUS.has(slot.action) || PAN[slot.action]) return;
    runAction(slot.action);
  });
  const buttonHeld = new Set();
  function startRepeat(action) {
    clearInterval(repeatTimer);
    if (PAN[action]) {
      buttonHeld.add(action);
      held.add(action);
      return;
    }
    runAction(action);
    repeatTimer = setInterval(function () { runAction(action); }, 80);
  }
  function releasePointerRepeats() {
    clearInterval(repeatTimer);
    buttonHeld.forEach(function (action) { held.delete(action); });
    buttonHeld.clear();
  }
  window.addEventListener('pointerup', releasePointerRepeats);
  window.addEventListener('pointercancel', releasePointerRepeats);

  document.getElementById('regen').addEventListener('click', doGenerate);
  document.getElementById('features-btn').addEventListener('click', function () {
    if (sheetKind === 'features' && !sheet.hidden) closeSheet(); else renderFeatures();
  });
  document.getElementById('layers-btn').addEventListener('click', function () {
    if (!features.layers) { toast('Turn on Layers in Features'); return; }
    if (sheetKind === 'layers' && !sheet.hidden) closeSheet(); else renderLayers();
  });
  document.getElementById('undo-btn').addEventListener('click', function () { undo(); });
  document.getElementById('redo-btn').addEventListener('click', function () { redo(); });
  document.getElementById('export-btn').addEventListener('click', function () { exportPNG(); });
  document.getElementById('rebind').addEventListener('click', function () {
    rebindMode = !rebindMode;
    document.getElementById('rebind').setAttribute('aria-pressed', rebindMode ? 'true' : 'false');
    setHint(rebindMode ? 'Tap a hotbar slot, then pick an action. Bindings reset when you leave.' : (HINTS[tool] || ''));
    if (!rebindMode) closeSheet();
  });
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  sheetBody.addEventListener('click', function (e) {
    const feat = e.target.closest('[data-feature]');
    if (feat) {
      const id = feat.dataset.feature;
      features[id] = !features[id];
      feat.setAttribute('aria-checked', features[id] ? 'true' : 'false');
      if (id === 'undo') updateUndoButtons();
      dirty = true;
      return;
    }
    const layerBtn = e.target.closest('[data-layer]');
    if (layerBtn) {
      const id = layerBtn.dataset.layer;
      layers[id] = !layers[id];
      layerBtn.setAttribute('aria-checked', layers[id] ? 'true' : 'false');
      dirty = true;
      return;
    }
    const assign = e.target.closest('[data-assign]');
    if (assign && pendingSlot) {
      const slot = slotByKey(pendingSlot);
      if (slot) slot.action = assign.dataset.assign;
      renderHotbar();
      renderPicker();
    }
  });

  let seaSnap = false;
  seaInput.addEventListener('pointerdown', function () { if (!seaSnap) { takeSnapshot(); seaSnap = true; } });
  seaInput.addEventListener('input', function () { setSea(seaInput.value); });
  seaInput.addEventListener('change', function () { seaSnap = false; setSea(seaInput.value); });
  seaNum.addEventListener('focus', function () { takeSnapshot(); });
  seaNum.addEventListener('input', function () { setSea(seaNum.value); });
  seedInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doGenerate(); }
  });

  stage.addEventListener('pointerdown', onPointerDown);
  stage.addEventListener('pointermove', onPointerMove);
  stage.addEventListener('pointerup', onPointerUp);
  stage.addEventListener('pointercancel', onPointerUp);
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    const w = clientToWorld(e.clientX, e.clientY);
    const factor = e.deltaY > 0 ? 0.92 : 1.08;
    const next = clamp(cam.zoom * factor, 0.35, 8);
    cam.cx = w.x - (w.x - cam.cx) * (cam.zoom / next);
    cam.cy = w.y - (w.y - cam.cy) * (cam.zoom / next);
    cam.zoom = next;
    dirty = true;
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Shift') liveShift = true;
    if (e.key === 'Control') liveCtrl = true;
    if (e.key === 'Alt') liveAlt = true;
    if (e.key === 'Meta') liveMeta = true;
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.target && e.target.closest && e.target.closest('input, textarea')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const slot = slotByKey(e.key.toLowerCase());
    if (!slot) return;
    const action = slot.action;
    if (PAN[action]) {
      if (!e.repeat) held.add(action);
      e.preventDefault();
      return;
    }
    if (e.repeat && !CONTINUOUS.has(action)) return;
    runAction(action);
    e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'Shift') liveShift = false;
    if (e.key === 'Control') liveCtrl = false;
    if (e.key === 'Alt') liveAlt = false;
    if (e.key === 'Meta') liveMeta = false;
    const slot = slotByKey((e.key || '').toLowerCase());
    if (slot && PAN[slot.action]) held.delete(slot.action);
    if (!e.key || e.key === 'Meta' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Shift') {
      /* modifiers */
    }
  });
  window.addEventListener('blur', function () { held.clear(); clearInterval(repeatTimer); });

  function frame() {
    let dx = 0, dy = 0;
    if (held.has('panLeft')) dx -= 1;
    if (held.has('panRight')) dx += 1;
    if (held.has('panUp')) dy -= 1;
    if (held.has('panDown')) dy += 1;
    if (dx || dy) {
      const sp = 9 / cam.zoom;
      cam.cx += dx * sp;
      cam.cy += dy * sp;
      dirty = true;
    }
    if (dirty) { dirty = false; draw(); }
    requestAnimationFrame(frame);
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr));
    const h = Math.max(1, Math.round(r.height * dpr));
    if (view.width !== w || view.height !== h) { view.width = w; view.height = h; }
    if (!didFit && r.width > 20 && r.height > 20) {
      cam.zoom = Math.min(r.width / W, r.height / H) * 0.98;
      cam.cx = W / 2; cam.cy = H / 2;
      didFit = true;
    }
    dirty = true;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);

  function findLand() {
    for (let y = 8; y < H - 8; y += 4) {
      for (let x = 8; x < W - 8; x += 4) {
        if (height[y * W + x] > sea + 0.05) return { x: x, y: y };
      }
    }
    return { x: W / 2, y: H / 2 };
  }

  const MOCK_BAR_VERSION = 'Mock bar v2.2';
  const MOCK_CHIP_BG_ALPHA = 0.3;
  const theme = { bg: { base: '#2a241c' } };
  function mockBgAlpha(css, a) {
    const m = /^#([0-9a-f]{6})$/i.exec(css || '');
    if (!m) return 'rgba(128,128,128,' + a + ')';
    const n = parseInt(m[1], 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  document.documentElement.style.setProperty('--mock-rest', mockBgAlpha(theme.bg.base, MOCK_CHIP_BG_ALPHA));
  document.documentElement.style.setProperty('--mock-solid', theme.bg.base);
  (function installMarks() {
    const HL = { y: '#e2b100', g: '#2f9e44', r: '#e03131' };
    const markLayer = document.getElementById('mark-layer');
    const markCanvas = document.getElementById('mark-canvas');
    const mctx = markCanvas.getContext('2d');
    const swatches = Array.from(document.querySelectorAll('.mock-swatch'));
    let hlColor = null;
    const marks = [];
    let drawing = null;
    function syncHl() {
      swatches.forEach(function (s) { s.setAttribute('aria-pressed', s.dataset.color === hlColor ? 'true' : 'false'); });
      markLayer.style.pointerEvents = hlColor == null ? 'none' : 'auto';
      markLayer.classList.toggle('is-live', hlColor != null);
    }
    function sizeMark() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      markCanvas.width = Math.round(window.innerWidth * dpr);
      markCanvas.height = Math.round(window.innerHeight * dpr);
      paintMarks();
    }
    function paintMarks() {
      const dpr = markCanvas.width / Math.max(1, window.innerWidth);
      mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      const all = drawing ? marks.concat([drawing]) : marks;
      markLayer.querySelectorAll('.mark-num').forEach(function (n) { n.remove(); });
      all.forEach(function (mark) {
        mctx.strokeStyle = HL[mark.color] || '#e2b100';
        mctx.fillStyle = HL[mark.color] || '#e2b100';
        mctx.lineWidth = 3;
        mctx.lineJoin = 'round';
        mctx.lineCap = 'round';
        if (mark.pts.length < 2) {
          mctx.beginPath();
          mctx.arc(mark.pts[0].x, mark.pts[0].y, 8, 0, Math.PI * 2);
          mctx.globalAlpha = 0.9;
          mctx.fill();
          mctx.globalAlpha = 1;
        } else {
          mctx.beginPath();
          mctx.moveTo(mark.pts[0].x, mark.pts[0].y);
          for (let i = 1; i < mark.pts.length; i++) mctx.lineTo(mark.pts[i].x, mark.pts[i].y);
          mctx.stroke();
        }
        const badge = document.createElement('span');
        badge.className = 'mark-num';
        badge.textContent = String(mark.n);
        badge.style.left = mark.pts[0].x + 'px';
        badge.style.top = mark.pts[0].y + 'px';
        badge.style.color = HL[mark.color];
        markLayer.appendChild(badge);
      });
    }
    swatches.forEach(function (s) {
      s.addEventListener('click', function () {
        hlColor = hlColor === s.dataset.color ? null : s.dataset.color;
        syncHl();
      });
    });
    document.getElementById('mock-numbers').addEventListener('click', function () {
      const on = markLayer.classList.toggle('numbers-off');
      this.setAttribute('aria-pressed', on ? 'false' : 'true');
    });
    document.getElementById('mock-dev').addEventListener('click', function () {
      const panel = document.getElementById('mock-dev-panel');
      panel.hidden = !panel.hidden;
      this.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
    });
    document.getElementById('mock-guides').addEventListener('click', function () {
      const on = document.body.classList.toggle('mock-guides');
      this.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    document.getElementById('mock-marks').addEventListener('click', function () {
      const hidden = markLayer.classList.toggle('marks-off');
      this.setAttribute('aria-pressed', hidden ? 'false' : 'true');
    });
    markLayer.addEventListener('pointerdown', function (e) {
      if (hlColor == null) return;
      markLayer.setPointerCapture(e.pointerId);
      drawing = { color: hlColor, pts: [{ x: e.clientX, y: e.clientY }], n: marks.length + 1 };
      paintMarks();
    });
    markLayer.addEventListener('pointermove', function (e) {
      if (!drawing) return;
      drawing.pts.push({ x: e.clientX, y: e.clientY });
      paintMarks();
    });
    function finishMark() {
      if (!drawing) return;
      marks.push(drawing);
      drawing = null;
      paintMarks();
    }
    markLayer.addEventListener('pointerup', finishMark);
    markLayer.addEventListener('pointercancel', finishMark);
    window.addEventListener('resize', sizeMark);
    sizeMark();
    syncHl();
    document.getElementById('mock-bar').dataset.version = MOCK_BAR_VERSION;
  })();

  window.LB = {
    version: 'landbox-mapmaker-standalone-v1',
    W: W, H: H,
    get seed() { return seed; },
    get lat() { return lat; },
    get lon() { return lon; },
    get tool() { return tool; },
    get sea() { return sea; },
    get brush() { return brush; },
    get cam() { return cam; },
    get features() { return features; },
    get layers() { return layers; },
    get stamps() { return stamps; },
    get rivers() { return rivers; },
    get roads() { return roads; },
    get borders() { return borders; },
    get labels() { return labels; },
    get stats() { return genStats; },
    get coastCount() { return coastLines.length; },
    get drawCount() { return drawCount; },
    get lastExport() { return lastExport; },
    get sculptMode() { return sculptMode; },
    get slots() { return slots; },
    palette: TERRAIN,
    clientToWorld: clientToWorld,
    worldToClient: worldToClient,
    heightAt: function (x, y) { return hAt(Math.round(x), Math.round(y)); },
    sampleTerrain: function (x, y) {
      const ix = clamp(Math.round(x), 0, W - 1), iy = clamp(Math.round(y), 0, H - 1);
      const d = tctx.getImageData(ix, iy, 1, 1).data;
      return [d[0], d[1], d[2], d[3]];
    },
    findLand: findLand,
    setTool: setTool,
    setSea: setSea,
    paintAt: function (x, y, name, radius) {
      terrainName = TERRAIN[name] ? name : terrainName;
      paintTerrainDisk(x, y, TERRAIN[terrainName].color, radius || brush);
      dirty = true;
    },
    sculptAt: function (x, y, sign) {
      sculptAt(x, y, sign >= 0 ? 1 : -1);
      buildCoast();
    },
    placeStamp: function (type, x, y) {
      const s = { id: uid(), type: type, x: x, y: y, size: 1, rot: stampRot, color: ink };
      stamps.push(s);
      dirty = true;
      return s.id;
    },
    addRiver: function (points, w0, w1) {
      const rv = { id: uid(), points: points, w0: w0 || 8, w1: w1 == null ? 1.4 : w1 };
      rivers.push(rv); dirty = true; return rv;
    },
    addRoad: function (points, style) {
      const rd = { id: uid(), points: points, style: style || 'solid' };
      roads.push(rd); dirty = true; return rd;
    },
    addBorder: function (points, style) {
      const bd = { id: uid(), points: points, style: style || 'dashed' };
      borders.push(bd); dirty = true; return bd;
    },
    addLabel: function (text, x, y) {
      const lab = { id: uid(), text: text, x: x, y: y, size: 15, curve: false, italic: false };
      labels.push(lab); dirty = true; return lab;
    },
    setLabelText: function (id, text) {
      const lab = labels.find(function (l) { return l.id === id; });
      if (lab) { lab.text = text; dirty = true; }
    },
    setLabelCurve: function (id, on) {
      const lab = labels.find(function (l) { return l.id === id; });
      if (lab) { lab.curve = !!on; dirty = true; }
    },
    moveLabel: function (id, x, y) {
      const lab = labels.find(function (l) { return l.id === id; });
      if (lab) { lab.x = x; lab.y = y; dirty = true; }
    },
    removeLabel: function (id) {
      const i = labels.findIndex(function (l) { return l.id === id; });
      if (i >= 0) labels.splice(i, 1);
      dirty = true;
    },
    moveStamp: function (id, x, y) {
      const s = stamps.find(function (o) { return o.id === id; });
      if (s) { s.x = x; s.y = y; dirty = true; }
    },
    deleteId: function (kind, id) {
      selection = { kind: kind, id: id };
      deleteSelection();
    },
    setFeature: function (id, on) {
      if (!(id in features)) return;
      features[id] = !!on;
      if (sheetKind === 'features') renderFeatures();
      updateUndoButtons();
      dirty = true;
    },
    setLayer: function (id, on) { layers[id] = !!on; dirty = true; },
    undo: undo,
    redo: redo,
    takeSnapshot: takeSnapshot,
    exportPNG: exportPNG,
    rebind: function (key, action) {
      const slot = slotByKey(String(key).toLowerCase());
      if (!slot || !ACTION_NAME[action]) return false;
      slot.action = action;
      renderHotbar();
      return true;
    },
    slotAction: function (key) {
      const slot = slotByKey(String(key).toLowerCase());
      return slot ? slot.action : null;
    },
    generate: function (s, la, lo) { generate(s, la, lo); },
    drawNow: function () { dirty = false; draw(); },
    viewSignature: function () {
      draw();
      const d = vctx.getImageData(0, 0, view.width, view.height).data;
      let hsh = 0;
      for (let i = 0; i < d.length; i += 97) hsh = (Math.imul(hsh, 33) + d[i] + d[i + 1] + d[i + 2]) >>> 0;
      return hsh;
    },
    mock: { version: MOCK_BAR_VERSION }
  };

  try {
    buildPaper();
    const start = parseHash();
    generate(start.seed, start.lat, start.lon);
    renderHotbar();
    renderContext();
    updateUndoButtons();
    resize();
    draw();
    requestAnimationFrame(frame);
    document.body.dataset.ready = '1';
  } catch (err) {
    const el = document.getElementById('boot-error');
    el.hidden = false;
    el.textContent = 'Landbox could not start: ' + (err && err.message ? err.message : err);
    console.error(err);
  }
})();
</script>
</body>
</html>
