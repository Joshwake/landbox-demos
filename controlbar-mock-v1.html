<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Landbox control bar — layout mockup – sample</title>
  <style>
    :root {
      --bg: #0e1218;
      --ink: #e7eee8;
      --muted: #8b948c;
      --dim: #5c655f;
      --line: #2a3340;
      --fill: #1b232e;
      --fill-2: #242d3a;
      --accent: #7ec8c4;
      --accent-soft: rgba(126, 200, 196, 0.16);
      --accent-line: rgba(126, 200, 196, 0.55);
      --on: #0e1218;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      --tap: 44px;
      --mock-gap: 84px;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    button, input { font: inherit; color: inherit; }
    button {
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }
    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 8;
      pointer-events: none;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c9d4c8;
      background: rgba(14, 18, 24, 0.82);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 12px;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .stage {
      flex: 1;
      position: relative;
      min-height: 0;
      background: radial-gradient(120% 80% at 50% 40%, #1a2430 0%, #0e1218 70%);
      overflow: hidden;
    }
    .world {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 56px 16px 140px;
    }
    .orb {
      width: min(58vh, 42vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 28% 26%, rgba(255,255,255,.22), transparent 32%),
        radial-gradient(ellipse 42% 32% at 64% 36%, #d2b56a 0 38%, transparent 42%),
        radial-gradient(ellipse 58% 50% at 36% 52%, #3d6a4a 0 48%, transparent 54%),
        radial-gradient(ellipse 34% 28% at 72% 64%, #2d5a3a 0 40%, transparent 46%),
        radial-gradient(circle at 50% 50%, #1c4a68 0 66%, #152e42 100%);
      box-shadow:
        inset -18px -12px 40px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.06),
        0 20px 50px rgba(0,0,0,.5);
      transition: width .35s ease, border-radius .35s ease, transform .35s ease;
    }
    .app[data-view="country"] .orb {
      width: min(78vh, 72vw, 520px);
      border-radius: 18px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.1), transparent 42%),
        radial-gradient(ellipse 50% 40% at 40% 45%, #3d6a4a 0 50%, transparent 54%),
        radial-gradient(ellipse 30% 22% at 68% 38%, #d2b56a 0 40%, transparent 46%),
        linear-gradient(160deg, #1c4a68 0%, #1a3a4a 40%, #16342c 100%);
    }
    .app[data-view="metro"] .orb {
      width: min(92vh, 88vw, 640px);
      border-radius: 8px;
      background:
        radial-gradient(circle at 48% 42%, #4a7a58 0 18%, transparent 22%),
        radial-gradient(ellipse 40% 20% at 58% 48%, #d2b56a 0 30%, transparent 36%),
        radial-gradient(ellipse 70% 50% at 40% 60%, #2a5a3a 0 50%, transparent 56%),
        linear-gradient(160deg, #1c4a68, #16342c);
    }

    .top {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      z-index: 6;
      pointer-events: none;
    }
    .top > * { pointer-events: auto; }
    .views {
      display: flex;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      box-shadow: var(--shadow);
    }
    .views button {
      min-width: var(--tap);
      min-height: var(--tap);
      padding: 0 14px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .views button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--on);
    }
    .top-tools { display: flex; gap: 6px; }
    .ico {
      width: var(--tap);
      height: var(--tap);
      border-radius: 12px;
      background: var(--fill);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ico[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent-line);
      color: var(--accent);
    }

    /* Dock is full width; nav rows leave a left gap for the collapsed Mock chip */
    .dock {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row {
      display: flex;
      align-items: stretch;
      gap: 6px;
      min-height: var(--tap);
    }
    .row.nav { padding-left: var(--mock-gap); }
    .cluster {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .tool {
      min-width: var(--tap);
      min-height: var(--tap);
      padding: 2px 6px 0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      color: var(--ink);
    }
    .tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tool span {
      font-size: 9px;
      letter-spacing: 0.02em;
      color: var(--muted);
      line-height: 1;
    }
    .tool[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .tool[aria-pressed="true"] span { color: var(--accent); }

    .timeline-wrap {
      flex: 1;
      min-width: 0;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 16px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow);
    }
    .tl-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .tl-year {
      color: var(--ink);
      font-weight: 700;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .track {
      position: relative;
      height: 36px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .rail {
      position: absolute;
      left: 0; right: 0;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #2a3a36, #3d5a4c 40%, #7ec8c4);
    }
    .fill {
      position: absolute;
      left: 0;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      width: 70%;
    }
    .ticks { position: absolute; inset: 0; pointer-events: none; }
    .ticks i {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 16px;
      margin-top: -8px;
      background: rgba(255,255,255,.28);
    }
    .head {
      position: absolute;
      top: 50%;
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      background: var(--ink);
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(14,18,24,.55);
      left: 70%;
    }

    .play {
      min-width: 56px;
      min-height: var(--tap);
      border-radius: 16px;
      background: var(--accent);
      color: var(--on);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      flex: 0 0 56px;
    }
    .play svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
    .play[aria-pressed="true"] {
      background: var(--fill-2);
      color: var(--accent);
      border: 1px solid var(--accent-line);
    }

    .terraform { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
    .brush {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 140px;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px 12px 4px 8px;
      box-shadow: var(--shadow);
    }
    .brush .km {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 13px;
      min-width: 3.2em;
      color: var(--accent);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .row.nav .cluster { flex-wrap: nowrap; flex: 0 0 auto; }
    .brush input[type="range"],
    .sea input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 28px;
      flex: 1;
      min-width: 80px;
      background: transparent;
      margin: 0;
    }
    .brush input[type="range"]::-webkit-slider-runnable-track,
    .sea input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 999px; background: var(--fill-2);
    }
    .brush input[type="range"]::-webkit-slider-thumb,
    .sea input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px; margin-top: -8px;
      border-radius: 50%; background: var(--accent); border: 2px solid #e8eee8; cursor: pointer;
    }
    .brush input[type="range"]::-moz-range-track,
    .sea input[type="range"]::-moz-range-track {
      height: 6px; border-radius: 999px; background: var(--fill-2); border: 0;
    }
    .brush input[type="range"]::-moz-range-thumb,
    .sea input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent); border: 2px solid #e8eee8;
    }

    .stamps {
      display: none;
      flex-wrap: wrap;
      gap: 4px;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .stamps.open { display: flex; }

    .globe-only { display: flex; }
    .map-only { display: none; }
    .app:not([data-view="globe"]) .globe-only { display: none; }
    .app:not([data-view="globe"]) .map-only { display: flex; }

    .sea {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px 12px 4px 8px;
      min-width: 160px;
      flex: 1;
      box-shadow: var(--shadow);
    }
    .sea .val {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 12px;
      min-width: 4.2em;
      color: var(--accent);
    }

    .sheet-back {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(8,10,14,.55);
      z-index: 12;
    }
    .sheet-back.open { display: block; }
    .sheet {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 56px;
      max-height: calc(100% - 72px);
      overflow: auto;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 12px 16px;
      box-shadow: var(--shadow);
      z-index: 13;
      display: none;
    }
    .sheet.open { display: block; }
    .sheet h3 {
      margin: 10px 0 6px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      font-weight: 600;
    }
    .sheet h3:first-child { margin-top: 0; }
    .grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .sheet .tool { background: var(--fill-2); }
    .layers { display: flex; flex-direction: column; gap: 2px; }
    .layer {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: var(--tap);
      padding: 0 8px;
      border-radius: 10px;
      color: var(--ink);
      font-size: 13px;
    }
    .layer .dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--accent); background: var(--accent); flex: 0 0 18px;
    }
    .layer[aria-pressed="false"] .dot { background: transparent; }
    .layer[aria-pressed="false"] { color: var(--muted); }

    @media (orientation: portrait) {
      .badge { left: 50%; transform: translateX(-50%); }
      .top { top: 36px; justify-content: center; flex-wrap: wrap; }
      .world { padding: 96px 16px 180px; }
      .orb { width: min(72vw, 42vh); }
      .app[data-view="country"] .orb,
      .app[data-view="metro"] .orb { width: min(88vw, 48vh); }
      .sheet { bottom: 56px; max-height: 62%; }
      .brush .tool[aria-hidden="true"] { display: none; }
      .row.nav { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="app" data-view="globe" id="app">
    <div class="badge">Layout mockup – sample</div>

    <div class="stage">
      <div class="world" aria-hidden="true"><div class="orb"></div></div>

      <div class="top">
        <div class="views" role="tablist" aria-label="View">
          <button type="button" role="tab" data-view="globe" aria-pressed="true">Globe</button>
          <button type="button" role="tab" data-view="country" aria-pressed="false">Country</button>
          <button type="button" role="tab" data-view="metro" aria-pressed="false">Metro</button>
        </div>
        <div class="top-tools">
          <button type="button" class="ico" id="btn-layers" aria-pressed="false" aria-label="Layers">
            <svg viewBox="0 0 24 24"><path d="M12 4 3 9l9 5 9-5-9-5Z"/><path d="M3 14l9 5 9-5"/></svg>
          </button>
          <button type="button" class="ico" id="btn-help" aria-pressed="false" aria-label="Quick reference">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.4 2.4 0 1 1 3.3 2.2c-.8.4-1.4 1-1.4 2v.3"/><path d="M12 17.2h.01"/></svg>
          </button>
        </div>
      </div>

      <div class="dock">
        <div class="row globe-only">
          <div class="timeline-wrap" aria-label="Timeline">
            <div class="tl-meta">
              <span>Then</span>
              <span class="tl-year" id="tl-year">800</span>
              <span>Now</span>
            </div>
            <div class="track" id="timeline" role="slider" aria-valuemin="-4000" aria-valuemax="2026" aria-valuenow="800" aria-label="Timeline year">
              <div class="rail"></div>
              <div class="fill" id="tl-fill"></div>
              <div class="ticks" id="tl-ticks"></div>
              <div class="head" id="tl-head"></div>
            </div>
          </div>
          <button type="button" class="play" id="play" aria-pressed="false" aria-label="Play sim">
            <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5.5v13L19 12 8 5.5Z"/></svg>
          </button>
        </div>

        <div class="row globe-only nav">
          <div class="cluster" aria-label="Pan">
            <button type="button" class="tool" data-tool="navigate" aria-pressed="true" aria-label="Move">
              <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/><path d="M12 4 9 7M12 4l3 3M12 20l-3-3M12 20l3-3M4 12l3-3M4 12l3 3M20 12l-3-3M20 12l-3 3"/></svg>
              <span>Move</span>
            </button>
            <button type="button" class="tool" data-act="zoom-in" aria-label="Zoom in">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4M11 8v6M8 11h6"/></svg>
              <span>In</span>
            </button>
            <button type="button" class="tool" data-act="zoom-out" aria-label="Zoom out">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4M8 11h6"/></svg>
              <span>Out</span>
            </button>
            <button type="button" class="tool" data-act="undo" aria-label="Undo">
              <svg viewBox="0 0 24 24"><path d="M9 8H5V4"/><path d="M5 8a8 8 0 1 1 2.2 6"/></svg>
              <span>Undo</span>
            </button>
            <button type="button" class="tool" data-act="redo" aria-label="Redo">
              <svg viewBox="0 0 24 24"><path d="M15 8h4V4"/><path d="M19 8a8 8 0 1 0-2.2 6"/></svg>
              <span>Redo</span>
            </button>
          </div>
          <div class="sea" aria-label="Sea level">
            <button type="button" class="tool" aria-hidden="true" tabindex="-1">
              <svg viewBox="0 0 24 24"><path d="M3 14c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/></svg>
              <span>Sea</span>
            </button>
            <input id="sea" type="range" min="-11000" max="9000" step="10" value="0" aria-label="Sea level in metres">
            <span class="val" id="sea-val">0 m</span>
          </div>
          <div class="cluster">
            <button type="button" class="tool" id="more-globe" aria-pressed="false" aria-label="More">
              <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
              <span>More</span>
            </button>
          </div>
        </div>

        <div class="row map-only">
          <div class="terraform">
            <div class="cluster" aria-label="Terraform">
              <button type="button" class="tool" data-tool="raise" aria-pressed="false" aria-label="Raise">
                <svg viewBox="0 0 24 24"><path d="M12 19V6"/><path d="m7 11 5-5 5 5"/></svg>
                <span>Raise</span>
              </button>
              <button type="button" class="tool" data-tool="lower" aria-pressed="false" aria-label="Lower">
                <svg viewBox="0 0 24 24"><path d="M12 5v13"/><path d="m7 13 5 5 5-5"/></svg>
                <span>Lower</span>
              </button>
              <button type="button" class="tool" data-tool="soften-coast" aria-pressed="false" aria-label="Soften coast">
                <svg viewBox="0 0 24 24"><path d="M4 16c3-4 5 2 8-2s5-5 8-3"/><path d="M4 20c3-4 5 2 8-2s5-5 8-3"/></svg>
                <span>Soften</span>
              </button>
              <button type="button" class="tool" data-tool="paint" aria-pressed="false" aria-label="Paint">
                <svg viewBox="0 0 24 24"><path d="M14.5 5.5 18 9l-8.5 8.5H6v-3.5L14.5 5.5Z"/><path d="M12.5 7.5 16 11"/></svg>
                <span>Paint</span>
              </button>
              <button type="button" class="tool" data-tool="stamps" aria-pressed="false" aria-label="Stamps">
                <svg viewBox="0 0 24 24"><path d="m12 4 7 16H5L12 4Z"/></svg>
                <span>Stamp</span>
              </button>
              <button type="button" class="tool" data-tool="river" aria-pressed="false" aria-label="Draw">
                <svg viewBox="0 0 24 24"><path d="M4 18c3-6 5 1 8-4s5-6 8-5"/></svg>
                <span>Draw</span>
              </button>
              <button type="button" class="tool" id="more-map" aria-pressed="false" aria-label="More">
                <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
                <span>More</span>
              </button>
            </div>
            <div class="stamps" id="stamp-row" aria-label="Stamp kind">
              <button type="button" class="tool" data-stamp="mountain" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="m4 18 5-8 3 4 2-3 6 7H4Z"/></svg><span>Peak</span></button>
              <button type="button" class="tool" data-stamp="hill" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 18c3-6 5-8 8-8s5 2 8 8H4Z"/></svg><span>Hill</span></button>
              <button type="button" class="tool" data-stamp="tree" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 20v-6"/><path d="M12 6 7 14h10L12 6Z"/></svg><span>Tree</span></button>
              <button type="button" class="tool" data-stamp="town" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 20V10l5-4 4 3v11"/><path d="M14 20V9h5v11"/><path d="M9 20v-4h3v4"/></svg><span>Town</span></button>
              <button type="button" class="tool" data-stamp="castle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20V8l2-2 2 2 2-3 2 3 2-2 2 2 2-2 2 2v12H4Z"/></svg><span>Castle</span></button>
              <button type="button" class="tool" data-stamp="tower" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M10 20V7l2-3 2 3v13"/><path d="M8 20h8"/></svg><span>Tower</span></button>
            </div>
          </div>
        </div>

        <div class="row map-only nav">
          <div class="cluster" aria-label="Pan">
            <button type="button" class="tool" data-tool="navigate" aria-pressed="false" aria-label="Move">

      head.style.left = p;

      }
      ticks.innerHTML = html;
    })();
    setYear(800);

    function yearFromEvent(e) {

    });

    });

    setBrush(brush.value);

    function setSea(v) { seaVal.textContent = Number(v) + ' m'; }
    sea.addEventListener('input', function () { setSea(sea.value); });
    setSea(sea.value);

    var layersBox = document.getElementById('layers');
    layerNames.forEach(function (name) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'layer';
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<span class="dot"></span><span>' + name + '</span>';
      b.addEventListener('click', function () {
        var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      layersBox.appendChild(b);
    });

    function openSheet() {
      sheet.classList.add('open');
      sheetBack.classList.add('open');
      document.getElementById('more-globe').setAttribute('aria-pressed', 'true');
      document.getElementById('more-map').setAttribute('aria-pressed', 'true');
    }
    function closeSheet() {
      sheet.classList.remove('open');
      sheetBack.classList.remove('open');
      document.getElementById('more-globe').setAttribute('aria-pressed', 'false');
      document.getElementById('more-map').setAttribute('aria-pressed', 'false');
    }
    document.getElementById('more-globe').addEventListener('click', function () {
      if (sheet.classList.contains('open')) closeSheet(); else openSheet();
    });
    document.getElementById('more-map').addEventListener('click', function () {
      if (sheet.classList.contains('open')) closeSheet(); else openSheet();
    });
    sheetBack.addEventListener('click', closeSheet);

    document.getElementById('btn-layers').addEventListener('click', function () {
      openSheet();
      document.getElementById('layers').scrollIntoView({ block: 'nearest' });
      this.setAttribute('aria-pressed', 'true');
    });
    document.getElementById('btn-help').addEventListener('click', function () {
      var on = this.getAttribute('aria-pressed') !== 'true';
      this.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    document.querySelectorAll('.sheet [data-tool]').forEach(function (b) {
      b.addEventListener('click', function () {
        exclusiveTools(sheet, b.getAttribute('data-tool'));
        var maps = document.querySelector('.row.map-only');
        if (maps) exclusiveTools(maps, b.getAttribute('data-tool'));
        stampRow.classList.remove('open');
        closeSheet();
      });
    });

        });
      });
    });

      b.addEventListener('click', function () {
        var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
  })();

    var armed=drawArmed();
    layer.classList.toggle('mockbar-v23-armed',armed);
    layer.setAttribute('aria-label', armed ? 'Highlighter drawing layer' : 'Highlighter marks (drawing paused — select a color)');
    layer.setAttribute('aria-disabled', armed?'false':'true');
    layer.setAttribute('aria-hidden', hlOpen?'false':'true');
  }

  function pt(e){
    var r=layer.getBoundingClientRect();
    return [(e.clientX-r.left)/(r.width||1),(e.clientY-r.top)/(r.height||1)];
  }
  layer.addEventListener('pointerdown',function(e){
    if(!drawArmed())return;
    e.preventDefault();
    if(live||(e.pointerType==='mouse'&&e.button!==0))return;
    try{layer.setPointerCapture(e.pointerId);}catch(_e){}
    live={id:e.pointerId,s:{c:HL[hlColor][1],p:[pt(e)]}};
    paintLayer();
  });
  layer.addEventListener('pointermove',function(e){
    if(!live||live.id!==e.pointerId)return;
    live.s.p.push(pt(e));
    paintLayer();
  });
  function endPtr(e){
    if(!live||live.id!==e.pointerId)return;
    var s=live.s;live=null;
    strokes=strokes.concat([s]);
    paintLayer();
  }
  layer.addEventListener('pointerup',endPtr);
  layer.addEventListener('pointercancel',endPtr);
  layer.addEventListener('lostpointercapture',endPtr);
  window.addEventListener('resize',onViewportChange);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',onViewportChange);
    window.visualViewport.addEventListener('scroll',onViewportChange);
  }

  function chip(opts){
    var b=document.createElement('button');
    b.type='button';
    b.className='mockbar-v23-chip';
    if(opts.label)b.setAttribute('aria-label',opts.label);
    if(opts.title)b.title=opts.title;
    if(opts.pressed!=null)b.setAttribute('aria-pressed',opts.pressed?'true':'false');
    if(opts.expanded!=null)b.setAttribute('aria-expanded',opts.expanded?'true':'false');
    if(opts.describedBy)b.setAttribute('aria-describedby',opts.describedBy);
    var bg=themeBg();
    var border=opts.border || ('1px solid '+themeBorder());
    b.style.border=border;
    b.style.fontWeight=opts.weight||'400';
    if(opts.outline){b.style.outline=opts.outline;b.style.outlineOffset=opts.outlineOffset||'1px';}
    else {b.style.outline='none';}
    function rest(){b.style.background=mockBgAlpha(bg,MOCK_CHIP_BG_ALPHA);b.style.opacity='1';b.style.color=themeText();}
    function hot(){b.style.background=bg;b.style.opacity='1';b.style.color=themeText();}
    rest();
    b.addEventListener('pointerenter',hot);
    b.addEventListener('pointerleave',rest);
    b.addEventListener('focus',hot);
    b.addEventListener('blur',rest);
    b.addEventListener('pointerdown',hot);
    if(opts.onClick)b.addEventListener('click',opts.onClick);
    if(opts.el)b.appendChild(opts.el);
    if(opts.text)b.appendChild(document.createTextNode(opts.text));
    return b;
  }

  function bindDrag(el, asToggle){
    el.style.touchAction='none';
    el.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      var pid=e.pointerId;
      try{el.setPointerCapture(pid);}catch(_e){}
      var sx=e.clientX,sy=e.clientY;
      var r=bar.getBoundingClientRect();
      var sl=r.left,st=r.top,sh=r.height;
      var didMove=false;
      function move(ev){
        if(ev.pointerId!==pid)return;
        var dx=ev.clientX-sx,dy=ev.clientY-sy;
        if(!didMove&&Math.hypot(dx,dy)<MOVE_THRESH)return;
        didMove=true;
        ev.preventDefault();
        bar.classList.add('mockbar-v23-dragging');
        var vp=viewportSize();
        pos={left:sl+dx,bottom:vp.h-(st+dy)-sh};
        applyPlace();
      }
      function up(ev){
        if(ev.pointerId!==pid)return;
        el.removeEventListener('pointermove',move);
        el.removeEventListener('pointerup',up);
        el.removeEventListener('pointercancel',up);
        window.removeEventListener('pointermove',move);
        window.removeEventListener('pointerup',up);
        window.removeEventListener('pointercancel',up);
        try{el.releasePointerCapture(pid);}catch(_e){}
        bar.classList.remove('mockbar-v23-dragging');
        if(didMove){skipClick=true;persistPos();}
      }
      el.addEventListener('pointermove',move);
      el.addEventListener('pointerup',up);
      el.addEventListener('pointercancel',up);
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
      window.addEventListener('pointercancel',up);
    });
    if(asToggle){
      el.addEventListener('click',function(e){
        if(skipClick){e.preventDefault();e.stopPropagation();skipClick=false;return;}
        openHl();
      });
    }
  }

  function hostRoot(){return document.documentElement;}

  function paintOverlays(){
    overlays.innerHTML='';
    if(!hlOpen)return;
    var flags=dev;
    if(!flags.boxes&&!flags.grid&&!flags.size&&!flags.tap&&!flags.overflow&&!flags.stamp)return;
    var w=window.visualViewport?window.visualViewport.width:window.innerWidth;
    var h=window.visualViewport?window.visualViewport.height:window.innerHeight;
    var land=w>=h;
    var rootEl=hostRoot();
    var rr=rootEl.getBoundingClientRect();
    if(flags.grid){
      var g=document.createElement('div');
      g.style.cssText='position:absolute;inset:0;background-image:linear-gradient(to right, rgba(56,189,248,0.18) 1px, transparent 1px), linear-gradient(to bottom, rgba(56,189,248,0.18) 1px, transparent 1px);background-size:8px 8px;box-shadow:inset 12px 0 0 rgba(251,191,36,0.12), inset -12px 0 0 rgba(251,191,36,0.12), inset 0 12px 0 rgba(251,191,36,0.12), inset 0 -12px 0 rgba(251,191,36,0.12)';
      overlays.appendChild(g);
    }
    function boxesOf(sel, pred, styleFn){
      if(!rootEl)return;
      Array.prototype.forEach.call(rootEl.querySelectorAll(sel),function(el){
        if(el.closest('#mockbar-v23-root'))return;
        var b=el.getBoundingClientRect();
        var rec={l:b.left-rr.left,t:b.top-rr.top,w:b.width,h:b.height};
        if(!pred(rec,el))return;
        var d=document.createElement('div');
        d.style.position='absolute';
        d.style.left=rec.l+'px';d.style.top=rec.t+'px';
        d.style.width=rec.w+'px';d.style.height=rec.h+'px';
        d.style.boxSizing='border-box';
        d.style.pointerEvents='none';
        styleFn(d,rec);
        overlays.appendChild(d);
      });
    }
    if(flags.boxes){
      boxesOf('header,nav,main,section,footer,aside,[role="dialog"],[role="region"],[role="group"]',
        function(b){return b.w>8&&b.h>8;},
        function(d){d.style.background='rgba(34,197,94,0.08)';d.style.outline='2px solid rgba(34,197,94,0.85)';d.style.outlineOffset='-1px';});
    }
    if(flags.tap){
      boxesOf('button,a,input,select,textarea,[role="button"]',
        function(b){return b.w>0&&b.h>0&&Math.min(b.w,b.h)<44;},
        function(d){d.style.outline='2px dashed #f97316';d.style.outlineOffset='1px';});
    }
    if(flags.overflow){
      boxesOf('p,span,strong,label,li,h1,h2,h3,h4,td,th,button,a',
        function(b,el){return el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1;},
        function(d,rec){d.style.width=Math.max(rec.w,4)+'px';d.style.height=Math.max(rec.h,4)+'px';d.style.outline='2px solid #ef4444';d.style.background='rgba(239,68,68,0.12)';});
    }
    if(flags.size){
      var s=document.createElement('div');
      s.style.cssText='position:absolute;left:8px;top:8px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;font-family:'+cssVar('--theme-font-family','system-ui,sans-serif');
      s.textContent=Math.round(w)+'\u00d7'+Math.round(h)+' \u00b7 '+(land?'landscape':'portrait');
      overlays.appendChild(s);
    }
    if(flags.stamp){
      var st=document.createElement('div');
      st.style.cssText='position:absolute;right:8px;bottom:8px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;font-family:'+cssVar('--theme-font-family','system-ui,sans-serif');
      st.textContent='App Mockup \u00b7 '+MOCK_BAR_VERSION+' \u00b7 '+MOCK_BAR_DATE;
      overlays.appendChild(st);
    }
  }

  function startOverlayLoop(){
    stopOverlayLoop();
    paintOverlays();
    overlayTimer=window.setInterval(paintOverlays,500);
    window.addEventListener('resize',paintOverlays);
    if(window.visualViewport)window.visualViewport.addEventListener('resize',paintOverlays);
  }
  function stopOverlayLoop(){
    if(overlayTimer){window.clearInterval(overlayTimer);overlayTimer=0;}
    window.removeEventListener('resize',paintOverlays);
    if(window.visualViewport)window.visualViewport.removeEventListener('resize',paintOverlays);
    overlays.innerHTML='';
  }

  function openHl(){
    frozen='';
    strokes=[];
    hlColor=0;
    devOpen=false;
    live=null;
    hlOpen=true;
    setLayerArmed();
    paintLayer();
    startOverlayLoop();
    renderBar();
  }
  function closeHl(){
    hlOpen=false;
    frozen=null;
    strokes=[];
    devOpen=false;
    hlColor=0;
    live=null;
    setLayerArmed();
    paintLayer();
    stopOverlayLoop();
    renderBar();
  }
  function toggleSwatch(i){
    hlColor=(hlColor===i)?null:i;
    if(!drawArmed()&&live){live=null;}
    setLayerArmed();
    paintLayer();
    renderBar();
  }
  function undoStroke(){strokes=strokes.slice(0,-1);paintLayer();}
  function clearStrokes(){strokes=[];paintLayer();}

  function gripEl(){
    var g=document.createElement('button');
    g.type='button';
    g.className='mockbar-v23-grip';
    g.setAttribute('aria-label','Drag to move Mock bar');
    g.title='Drag';
    var ns='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(ns,'svg');
    svg.setAttribute('aria-hidden','true');
    svg.setAttribute('focusable','false');
    svg.setAttribute('width','18');
    svg.setAttribute('height','12');
    svg.setAttribute('viewBox','0 0 18 12');
    svg.setAttribute('fill','currentColor');
    var dots=[[3,2],[9,2],[15,2],[3,10],[9,10],[15,10]];
    dots.forEach(function(p){
      var c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',String(p[0]));
      c.setAttribute('cy',String(p[1]));
      c.setAttribute('r','1.6');
      svg.appendChild(c);
    });
    g.appendChild(svg);
    bindDrag(g,false);
    return g;
  }

  function renderBar(){
    bar.innerHTML='';
    if(!hlOpen){
      var open=chip({label:'Open Mock highlighter',title:'Mock',weight:'600'});
      open.appendChild(iconSvg('pen'));
      var lab=document.createElement('span');
      lab.style.marginLeft='2px';lab.style.opacity='1';
      lab.textContent='Mock';
      open.appendChild(lab);
      bindDrag(open,true);
      bar.appendChild(open);
      applyPlace();
      return;
    }
    bar.appendChild(gripEl());
    bar.appendChild(chip({
      label:'Done — close highlighter and restore controls',
      title:'Done',weight:'600',describedBy:'mockbar-v23-sr',onClick:closeHl,el:iconSvg('done')
    }));
    HL.forEach(function(h,i){
      var sel=hlColor===i;
      var dot=document.createElement('span');
      dot.className='mockbar-v23-dot';
      dot.setAttribute('aria-hidden','true');
      dot.style.background=h[1];
      var c=chip({
        label:sel? h[0]+', selected — tap to deselect' : h[0]+', tap to select',
        title:sel? h[0]+' (selected — tap to deselect)' : h[0],
        pressed:sel,
        weight:sel?'700':'400',
        border:sel?('2px solid '+themeText()):('1px dashed '+themeBorder()),
        outline:sel?('2px solid '+h[1]):undefined,
        onClick:function(){toggleSwatch(i);},
        el:dot
      });
      bar.appendChild(c);
    });
    bar.appendChild(chip({label:'Undo last mark',title:'Undo',onClick:undoStroke,el:iconSvg('undo')}));
    bar.appendChild(chip({label:'Clear all marks',title:'Clear',onClick:clearStrokes,el:iconSvg('clear')}));
    bar.appendChild(chip({
      label:'Dev overlays',title:'Dev',expanded:devOpen,pressed:devOpen,
      weight:devOpen?'700':'400',
      border:devOpen?('2px solid '+themeText()):('1px solid '+themeBorder()),
      onClick:function(){devOpen=!devOpen;renderBar();},
      el:iconSvg('dev')
    }));
    if(devOpen){
      var grp=document.createElement('span');
      grp.className='mockbar-v23-dev';
      grp.setAttribute('role','group');
      grp.setAttribute('aria-label','Dev overlay toggles');
      function devChip(key,title,text){
        var on=dev[key];
        return chip({
          title:title,pressed:on,text:text,
          weight:on?'700':'400',
          border:on?('2px solid '+themeText()):('1px solid '+themeBorder()),
          onClick:function(){dev[key]=!dev[key];paintOverlays();renderBar();}
        });
      }
      grp.appendChild(devChip('boxes','Show boxes','Boxes'));
      grp.appendChild(devChip('grid','Layout grid','Grid'));
      grp.appendChild(devChip('size','Screen size','Size'));
      grp.appendChild(devChip('tap','Tap targets under 44px','Tap'));
      grp.appendChild(devChip('overflow','Text overflow','Overflow'));
      grp.appendChild(devChip('stamp','Version stamp','Stamp'));
      bar.appendChild(grp);
    }
    var st=document.createElement('span');
    st.className='mockbar-v23-status';
    st.setAttribute('role','status');
    st.textContent=drawArmed()?('Drawing: '+HL[hlColor][0]):'No color — page free to scroll/tap';
    bar.appendChild(st);
    var sr=document.createElement('span');
    sr.id='mockbar-v23-sr';
    sr.className='';
    sr.style.cssText='position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);border:0';
    sr.textContent=(frozen?'View frozen. ':'Snapshot unavailable; live view shown, gestures blocked. ')+(drawArmed()?'Drawing armed. ':'No swatch selected; overlay ignores pointers. ')+'Tap selected swatch to deselect. Screenshot to capture marks.';
    bar.appendChild(sr);
    applyPlace();
  }

  var ro=typeof ResizeObserver!=='undefined'?new ResizeObserver(function(){if(hlOpen)paintLayer();}):null;
  if(ro)ro.observe(layer);
  pos=readStoredPos();
  renderBar();
})();
</script>

</body>
